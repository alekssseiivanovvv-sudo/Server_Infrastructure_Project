---
- name: Install libvirt and Python bindings
  ansible.builtin.apt:
    name: "{{ libvirt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Define internal network if absent
  community.libvirt.virt_net:
    name: internal
    state: present
    xml: |
      <network>
        <name>internal</name>
        <bridge name='virbr-internal'/>
      </network>

- name: Start internal network
  community.libvirt.virt_net:
    name: internal
    state: active

- name: Enable internal network at boot
  community.libvirt.virt_net:
    name: internal
    autostart: true

- name: Define management network if absent
  community.libvirt.virt_net:
    name: management
    state: present
    xml: |
      <network>
        <name>management</name>
        <bridge name='virbr-mgmt'/>
        <ip address='{{ management_host_ip }}' prefix='27'/>
      </network>

- name: Start management network
  community.libvirt.virt_net:
    name: management
    state: active

- name: Enable management network at boot
  community.libvirt.virt_net:
    name: management
    autostart: true
