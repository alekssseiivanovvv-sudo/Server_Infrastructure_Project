---
- name: Prepare automation account on hypervisor hosts
  hosts: hypervisor_hosts
  become: true
  gather_facts: false
  serial: 1

  vars_files:
    - group_vars/group/all/vault.yml

  vars:
    ansible_user: "{{ bootstrap_user | default('ansible_admin') }}"

    selected_admin_users: >-
      {{
        vault_admin_users
        | selectattr('name', 'equalto', 'ansible_admin')
        | list
      }}

  roles:
    - automation_account

- name: Verify ansible_admin and configure SSH
  hosts: hypervisor_hosts
  become: false
  gather_facts: false
  serial: 1

  vars:
    ansible_user: ansible_admin
    ansible_password: ""
    ansible_become_password: ""

    ansible_ssh_extra_args: >-
      -o PreferredAuthentications=publickey
      -o PasswordAuthentication=no
      -o KbdInteractiveAuthentication=no

  tasks:
    - name: Close existing SSH connection
      ansible.builtin.meta: reset_connection

    - name: Check SSH connection and passwordless sudo
      ansible.builtin.command: sudo -n id -u
      register: sudo_check
      changed_when: false
      failed_when: sudo_check.stdout != '0'

    - name: Configure SSH
      ansible.builtin.include_role:
        name: automation_sshd
        apply:
          become: true

- name: Prepare libvirt storage layout on hypervisors
  hosts: hypervisor_hosts
  become: true
  gather_facts: false
  serial: 1

  tasks:
    - name: Create directories for templates and VM disks
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0711"
      loop:
        - /var/lib/libvirt/images/templates
        - /var/lib/libvirt/images/vms

    - name: Check templates libvirt storage pool
      ansible.builtin.command: virsh -c qemu:///system pool-info templates
      register: templates_pool_check
      changed_when: false
      failed_when: false

    - name: Define templates libvirt storage pool
      ansible.builtin.command: >-
        virsh -c qemu:///system pool-define-as
        templates dir - - - - /var/lib/libvirt/images/templates
      when: templates_pool_check.rc != 0
      changed_when: true

    - name: Start templates libvirt storage pool
      ansible.builtin.command: virsh -c qemu:///system pool-start templates
      register: templates_pool_start
      changed_when: templates_pool_start.rc == 0
      failed_when: >-
        templates_pool_start.rc != 0
        and 'already active' not in templates_pool_start.stderr

    - name: Enable templates pool autostart
      ansible.builtin.command: virsh -c qemu:///system pool-autostart templates
      changed_when: false

    - name: Verify templates storage pool
      ansible.builtin.command: virsh -c qemu:///system pool-info templates
      changed_when: false