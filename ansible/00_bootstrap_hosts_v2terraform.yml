---
- name: Prepare automation account on hypervisor hosts
  hosts: hypervisor_hosts
  become: true
  gather_facts: false
  serial: 1

  vars_files:
    - group_vars/group/all/vault.yml

  vars:
    ansible_user: "{{ bootstrap_user | default('ansible_admin') }}"

    selected_admin_users: >-
      {{
        vault_admin_users
        | selectattr('name', 'equalto', 'ansible_admin')
        | list
      }}

  roles:
    - automation_account


- name: Verify ansible_admin and configure SSH
  hosts: hypervisor_hosts
  become: false
  gather_facts: false
  serial: 1

  vars:
    ansible_user: ansible_admin
    ansible_password: ""
    ansible_become_password: ""

    ansible_ssh_extra_args: >-
      -o PreferredAuthentications=publickey
      -o PasswordAuthentication=no
      -o KbdInteractiveAuthentication=no

  tasks:
    - name: Close existing SSH connection
      ansible.builtin.meta: reset_connection

    - name: Check SSH connection and passwordless sudo
      ansible.builtin.command: sudo -n id -u
      register: sudo_check
      changed_when: false
      failed_when: sudo_check.stdout != "0"

    - name: Configure SSH
      ansible.builtin.include_role:
        name: automation_sshd
        apply:
          become: true


- name: Prepare libvirt bootstrap configuration
  hosts: hypervisor_hosts
  become: true
  gather_facts: false
  serial: 1

  handlers:
    - name: Reload AppArmor
      ansible.builtin.systemd_service:
        name: apparmor
        state: reloaded

    - name: Allow QEMU service account to access libvirt storage
      ansible.builtin.user:
        name: libvirt-qemu
        groups:
          - kvm
        append: true

- name: Configure libvirt storage permissions and AppArmor
  hosts: hypervisor_hosts
  become: true
  gather_facts: false
  serial: 1

  vars:
    libvirt_templates_directory: /var/lib/libvirt/images/templates
    libvirt_qemu_user: libvirt-qemu
    libvirt_qemu_group: libvirt-qemu

  handlers:
    - name: Reload AppArmor
      ansible.builtin.systemd_service:
        name: apparmor
        state: reloaded

  tasks:
    - name: Check templates directory
      ansible.builtin.stat:
        path: "{{ libvirt_templates_directory }}"
      register: templates_directory

    - name: Verify templates directory exists
      ansible.builtin.assert:
        that:
          - templates_directory.stat.exists
          - templates_directory.stat.isdir
        fail_msg: >-
          {{ libvirt_templates_directory }} does not exist.
          Install the base images before running this playbook.

    - name: Configure templates directory permissions
      ansible.builtin.file:
        path: "{{ libvirt_templates_directory }}"
        state: directory
        owner: root
        group: "{{ libvirt_qemu_group }}"
        mode: "0750"

    - name: Find template subdirectories
      ansible.builtin.find:
        paths: "{{ libvirt_templates_directory }}"
        file_type: directory
        recurse: true
      register: template_directories

    - name: Configure template subdirectory permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ libvirt_qemu_group }}"
        mode: "0750"
      loop: "{{ template_directories.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Find template image files
      ansible.builtin.find:
        paths: "{{ libvirt_templates_directory }}"
        file_type: file
        recurse: true
      register: template_images

    - name: Verify template images exist
      ansible.builtin.assert:
        that:
          - template_images.matched | int > 0
        fail_msg: >-
          No template images were found in
          {{ libvirt_templates_directory }}.

    - name: Configure template image permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: root
        group: "{{ libvirt_qemu_group }}"
        mode: "0640"
      loop: "{{ template_images.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Ensure local AppArmor abstractions directory exists
      ansible.builtin.file:
        path: /etc/apparmor.d/local/abstractions
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Allow QEMU access to project storage
      ansible.builtin.blockinfile:
        path: /etc/apparmor.d/local/abstractions/libvirt-qemu
        create: true
        owner: root
        group: root
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED LIBVIRT STORAGE"
        block: |
          # Base images — read-only access and locking
          /var/lib/libvirt/images/templates/ r,
          /var/lib/libvirt/images/templates/** rk,

          # Terraform-managed VM disks
          /var/lib/libvirt/images/vms/ r,
          /var/lib/libvirt/images/vms/** rwk,
      notify: Reload AppArmor

    - name: Apply AppArmor changes
      ansible.builtin.meta: flush_handlers

    - name: Verify QEMU service account can read template images
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - "{{ libvirt_qemu_user }}"
          - --
          - test
          - -r
          - "{{ item.path }}"
      loop: "{{ template_images.files }}"
      loop_control:
        label: "{{ item.path }}"
      changed_when: false