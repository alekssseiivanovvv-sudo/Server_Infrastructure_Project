---
- name: Install central monitoring stack
  hosts: monitoring_servers
  become: true
  gather_facts: true

  vars_files:
    - group_vars/group/all/vault.yml

  vars:
    prometheus_version: "3.5.0"
    prometheus_admin_user: prometheus_sysuser
    loki_version: "3.5.1"
    grafana_dashboard_source_dir: "{{ playbook_dir }}/files/grafana/dashboards"
    grafana_home_dashboard_path: /var/lib/grafana/dashboards/project/project-overview.json

  roles:
    - monitoring_server
