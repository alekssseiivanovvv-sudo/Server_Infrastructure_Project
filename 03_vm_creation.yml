  vars:
    vm_name: east_web
    vm_os: alpine
    vm_ip: 192.168.72.2
    vm_gateway: 192.168.72.1
    vm_memory: 3072
    vm_cpus: 2
    vm_disk_size: 20G
    vm_mac: "52:54:00:72:02:01"
