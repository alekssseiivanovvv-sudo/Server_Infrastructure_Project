---
- name: Create Alpine routers on their hypervisors
  hosts: hypervisor_hosts
  become: true
  gather_facts: false

  vars_files:
    - group_vars/group/all/vault.yml

  vars:
    selected_admin_users: >-
      {{
        vault_admin_users
        | selectattr('name', 'equalto', 'ansible_admin')
        | list
      }}

  tasks:
    - name: Create routers assigned to this hypervisor
      ansible.builtin.include_role:
        name: router_creation
      loop: "{{ hypervisor_routers | default([]) }}"
      loop_control:
        loop_var: router_spec
        label: "{{ router_spec.name }}"
      when: routers_creation_enabled | default(false) | bool
      vars:
        router_name: "{{ router_spec.name }}"
        router_hostname: "{{ router_spec.hostname }}"
        router_lan_address: "{{ router_spec.lan_address }}"
        router_wan_mac: "{{ router_spec.wan_mac }}"
        router_lan_mac: "{{ router_spec.lan_mac }}"

    - name: Explain skipped hypervisor
      ansible.builtin.debug:
        msg: Router creation is disabled for this host. Set its image and storage paths before enabling it.
      when: not (routers_creation_enabled | default(false) | bool)
