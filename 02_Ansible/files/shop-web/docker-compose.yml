services:
  backend:
    build: ./backend
    container_name: python-backend
    env_file:
      - .env
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: nginx-web
    ports:
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
