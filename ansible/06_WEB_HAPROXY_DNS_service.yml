---
- name: Configure shop web workers
  hosts: web_servers
  become: true
  gather_facts: true

  vars_files:
    - group_vars/group/all/vault.yml

  roles:
    - shop_web


- name: Configure site HAProxy nodes
  hosts: balance_servers
  become: true
  gather_facts: true

  vars_files:
    - group_vars/group/all/vault.yml

  roles:
    - haproxy


- name: Configure external DNS failover for the shop
  hosts: inet_dns_servers
  become: true
  gather_facts: true

  roles:
    - external_dns
