---
- name: Delete project servers from host_1
  hosts: host_1
  become: true
  gather_facts: false
  tags:
    - never
    - delete_servers

  vars:
    project_servers:
      - name: east_web
        directory: "/mnt/p5+/KVM/east_web"
      - name: east_db
        directory: "/mnt/p5+/KVM/east_db"
      - name: east_storage
        directory: "/mnt/p5+/KVM/east_storage"
      - name: load_balancer
        directory: "/mnt/p5+/KVM/load_balancer"
      - name: cloud_quorum
        directory: "/mnt/p5+/KVM/cloud_quorum"
      - name: monitoring
        directory: "/mnt/p5+/KVM/monitoring"

  tasks:
    - name: List running VMs
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - list
          - --name
      register: running_vms
      changed_when: false

    - name: List all VMs
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - list
          - --all
          - --name
      register: existing_vms
      changed_when: false

    - name: Stop running project servers
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - destroy
          - "{{ item.name }}"
      loop: "{{ project_servers }}"
      when: item.name in running_vms.stdout_lines

    - name: Undefine project servers
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - undefine
          - "{{ item.name }}"
      loop: "{{ project_servers }}"
      when: item.name in existing_vms.stdout_lines

    - name: Delete project server directories
      ansible.builtin.file:
        path: "{{ item.directory }}"
        state: absent
      loop: "{{ project_servers }}"


