---
- name: Apply router sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-router.conf
  changed_when: false

- name: Apply router firewall
  ansible.builtin.service:
    name: nftables
    # Alpine's stop/restart flushes the entire ruleset, including Fail2ban
    # and Tailscale tables. Reload applies only our lab_router replacement.
    state: reloaded
