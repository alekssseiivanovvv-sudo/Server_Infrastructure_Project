---
- name: Select SeaweedFS administrator from Vault
  ansible.builtin.set_fact:
    selected_seaweed_admin_users: "{{ vault_admin_users | selectattr('name', 'equalto', seaweed_admin_user) | list }}"
  no_log: true

- name: Check SeaweedFS administrator configuration
  ansible.builtin.assert:
    that:
      - selected_seaweed_admin_users | length == 1
    fail_msg: "Vault must contain exactly one {{ seaweed_admin_user }} account."

- name: Create SeaweedFS administrator
  ansible.builtin.user:
    name: "{{ selected_seaweed_admin_users[0].name }}"
    password: "{{ selected_seaweed_admin_users[0].password_hash }}"
    update_password: always
    shell: /bin/bash
    create_home: true
    state: present
  no_log: true

- name: Install SeaweedFS dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - tar
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create SeaweedFS installation directory
  ansible.builtin.file:
    path: "/tmp/seaweedfs-{{ seaweedfs_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download SeaweedFS release archive
  ansible.builtin.get_url:
    url: "https://github.com/seaweedfs/seaweedfs/releases/download/{{ seaweedfs_version }}/linux_amd64.tar.gz"
    dest: "/tmp/seaweedfs-{{ seaweedfs_version }}.tar.gz"
    owner: root
    group: root
    mode: "0644"

- name: Extract SeaweedFS release archive
  ansible.builtin.unarchive:
    src: "/tmp/seaweedfs-{{ seaweedfs_version }}.tar.gz"
    dest: "/tmp/seaweedfs-{{ seaweedfs_version }}"
    remote_src: true
    creates: "/tmp/seaweedfs-{{ seaweedfs_version }}/weed"

- name: Install weed binary
  ansible.builtin.copy:
    src: "/tmp/seaweedfs-{{ seaweedfs_version }}/weed"
    dest: /usr/local/bin/weed
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart SeaweedFS

- name: Create SeaweedFS data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ seaweed_admin_user }}"
    group: "{{ seaweed_admin_user }}"
    mode: "0750"
  loop:
    - "{{ seaweed_data_dir }}"
    - "{{ seaweed_data_dir }}/master"
    - "{{ seaweed_data_dir }}/volume"
    - "{{ seaweed_data_dir }}/filer"

- name: Create SeaweedFS S3 config directory
  ansible.builtin.file:
    path: "{{ seaweed_s3_config_dir }}"
    state: directory
    owner: root
    group: "{{ seaweed_admin_user }}"
    mode: "0750"
  when: seaweed_s3_config_file is defined

- name: Configure SeaweedFS S3 credentials
  ansible.builtin.copy:
    dest: "{{ seaweed_s3_config_file }}"
    owner: root
    group: "{{ seaweed_admin_user }}"
    mode: "0640"
    content: |
      {
        "identities": [
          {
            "name": "shop-app",
            "credentials": [
              {
                "accessKey": "{{ vault_shop_seaweed_access_key }}",
                "secretKey": "{{ vault_shop_seaweed_secret_key }}"
              }
            ],
            "actions": [
              "Admin",
              "Read",
              "Write",
              "List",
              "Tagging"
            ],
            "resources": [
              "buckets/product-images",
              "buckets/product-images/*"
            ]
          }
        ]
      }
  when: seaweed_s3_config_file is defined
  no_log: true
  notify:
    - Restart SeaweedFS

- name: Configure SeaweedFS master service
  ansible.builtin.template:
    src: seaweed-master.service.j2
    dest: /etc/systemd/system/seaweed-master.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart SeaweedFS

- name: Configure SeaweedFS volume service
  ansible.builtin.template:
    src: seaweed-volume.service.j2
    dest: /etc/systemd/system/seaweed-volume.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart SeaweedFS

- name: Configure SeaweedFS filer service
  ansible.builtin.template:
    src: seaweed-filer.service.j2
    dest: /etc/systemd/system/seaweed-filer.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart SeaweedFS

- name: Configure SeaweedFS S3 service
  ansible.builtin.template:
    src: seaweed-s3.service.j2
    dest: /etc/systemd/system/seaweed-s3.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart SeaweedFS

- name: Configure initial SeaweedFS sync service
  ansible.builtin.template:
    src: seaweed-sync.service.j2
    dest: /etc/systemd/system/seaweed-sync.service
    owner: root
    group: root
    mode: "0644"
  when:
    - seaweed_enable_sync | default(false) | bool
    - inventory_hostname == (seaweed_primary_host | default(''))
  notify:
    - Reload systemd
    - Restart SeaweedFS sync

- name: Remove SeaweedFS sync service when sync is disabled or node is passive
  ansible.builtin.file:
    path: /etc/systemd/system/seaweed-sync.service
    state: absent
  when: >-
    not (seaweed_enable_sync | default(false) | bool)
    or inventory_hostname != (seaweed_primary_host | default(''))
  notify: Reload systemd

- name: Enable and start SeaweedFS services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - seaweed-master
    - seaweed-volume
    - seaweed-filer
    - seaweed-s3

- name: Enable and start SeaweedFS sync on primary node
  ansible.builtin.systemd:
    name: seaweed-sync
    enabled: true
    state: started
    daemon_reload: true
  when:
    - seaweed_enable_sync | default(false) | bool
    - inventory_hostname == (seaweed_primary_host | default(''))

- name: Disable SeaweedFS sync when sync is disabled or node is passive
  ansible.builtin.systemd:
    name: seaweed-sync
    enabled: false
    state: stopped
    daemon_reload: true
  when: >-
    not (seaweed_enable_sync | default(false) | bool)
    or inventory_hostname != (seaweed_primary_host | default(''))
  failed_when: false

- name: Check SeaweedFS version
  ansible.builtin.command: /usr/local/bin/weed version
  register: seaweed_version_check
  changed_when: false

- name: Show SeaweedFS version
  ansible.builtin.debug:
    msg: "{{ seaweed_version_check.stdout }}"
