---
router_instance_id: "{{ router_hostname }}-001"

router_directory: "{{ router_storage_directory }}/{{ router_name }}"
router_disk: "{{ router_directory }}/{{ router_name }}.qcow2"
router_disk_size_bytes: 2147483648

router_memory_mb: 1024
router_vcpus: 1

router_wan_network: default
router_lan_network: internal

router_lan_netmask: 255.255.255.224
router_public_key_file: ~/.ssh/ansible.pub
