---
- name: Create project routers
  ansible.builtin.import_playbook: 02_routers_creation.yml

- name: Wait after router creation
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait for routers to finish booting
      ansible.builtin.pause:
        minutes: 1

- name: Create project virtual machines
  ansible.builtin.import_playbook: 03_vm_creation.yml

- name: Wait after virtual machine creation
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait for virtual machines to finish booting
      ansible.builtin.pause:
        minutes: 1

- name: Configure users
  ansible.builtin.import_playbook: 04_users.yml

- name: Configure S3 storage
  ansible.builtin.import_playbook: 05_storage_service.yml

- name: Configure database cluster
  ansible.builtin.import_playbook: 06_database_cluster.yml

- name: Configure web workers and HAProxy
  ansible.builtin.import_playbook: 07_web_haproxy_service.yml

- name: Configure TLS certificates
  ansible.builtin.import_playbook: 08_tls_certificates.yml

- name: Install project CA in Firefox
  ansible.builtin.import_playbook: 09_install_ca_firefox.yml

- name: Configure monitoring server
  ansible.builtin.import_playbook: 10_monitoring_server.yml

- name: Configure monitoring agents
  ansible.builtin.import_playbook: 11_monitoring_agents.yml
