---

- name: List existing virtual machines
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - qemu:///system
      - list
      - --all
      - --name
  register: router_domains
  changed_when: false

- name: Create router if it does not exist
  when: router_name not in router_domains.stdout_lines
  block:
    - name: Check administrator selection
      ansible.builtin.assert:
        that:
          - selected_admin_users | length == 1
        fail_msg: Vault must contain exactly one ansible_admin account.

    - name: Create VM directory
      ansible.builtin.file:
        path: "{{ router_directory }}"
        state: directory
        owner: root
        group: kvm
        mode: "0750"

    - name: Create private cloud-init directory
      ansible.builtin.file:
        path: "{{ router_directory }}/cloud-init"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate cloud-init files from templates
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ router_directory }}/cloud-init/{{ item }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - user-data
        - meta-data
        - network-config
      no_log: true
      diff: false

    - name: Create independent VM disk
      ansible.builtin.command:
        argv:
          - qemu-img
          - convert
          - -f
          - qcow2
          - -O
          - qcow2
          - "{{ router_image }}"
          - "{{ router_disk }}"
        creates: "{{ router_disk }}"

    - name: Read VM disk size
      ansible.builtin.command:
        argv:
          - qemu-img
          - info
          - --output=json
          - "{{ router_disk }}"
      register: router_disk_info
      changed_when: false

    - name: Expand VM disk
      ansible.builtin.command:
        argv:
          - qemu-img
          - resize
          - "{{ router_disk }}"
          - "{{ router_disk_size_bytes | string }}"
      when: >-
        (router_disk_info.stdout | from_json)['virtual-size'] | int
        < router_disk_size_bytes | int

    - name: Set VM disk permissions
      ansible.builtin.file:
        path: "{{ router_disk }}"
        owner: libvirt-qemu
        group: kvm
        mode: "0600"

    - name: Create cloud-init seed ISO
      ansible.builtin.command:
        argv:
          - cloud-localds
          - "--network-config={{ router_directory }}/cloud-init/network-config"
          - "{{ router_directory }}/seed.iso"
          - "{{ router_directory }}/cloud-init/user-data"
          - "{{ router_directory }}/cloud-init/meta-data"
      no_log: true

    - name: Set seed ISO permissions
      ansible.builtin.file:
        path: "{{ router_directory }}/seed.iso"
        owner: root
        group: kvm
        mode: "0640"

    - name: Create and start router VM
      ansible.builtin.command: >-
        virt-install
        --connect qemu:///system
        --name {{ router_name | quote }}
        --memory {{ router_memory_mb }}
        --vcpus {{ router_vcpus }}
        --osinfo generic
        --import
        --boot hd
        --disk {{ ('path=' ~ router_disk ~ ',format=qcow2,bus=virtio') | quote }}
        --disk {{ ('path=' ~ router_directory ~ '/seed.iso,format=raw,device=cdrom') | quote }}
        --network network={{ router_wan_network }},model=virtio,mac={{ router_wan_mac }}
        --network network={{ router_lan_network }},model=virtio,mac={{ router_lan_mac }}
        --graphics none
        --console pty,target_type=serial
        --noautoconsole
        --autostart

- name: Show next verification step
  ansible.builtin.debug:
    msg: >-
      {{ router_name }} is defined.
      Existing VMs are not recreated or rebooted.
      Check the console, Tailscale registration and cloud-init status.
