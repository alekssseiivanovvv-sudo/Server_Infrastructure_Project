---
- name: Install etcd on quorum node
  hosts: etcd_servers
  become: true
  gather_facts: true
  vars_files:
    - group_vars/group/all/vault.yml
  vars:
    etcd_name: "{{ inventory_hostname }}"
    etcd_data_dir: /var/lib/etcd
    etcd_client_port: 2379
    etcd_peer_port: 2380

  tasks:
    - name: Install etcd packages
      ansible.builtin.apt:
        name:
          - etcd-server
          - etcd-client
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure single-node etcd for Patroni DCS
      ansible.builtin.copy:
        dest: /etc/default/etcd
        owner: root
        group: root
        mode: "0644"
        content: |
          ETCD_NAME="{{ etcd_name }}"
          ETCD_DATA_DIR="{{ etcd_data_dir }}"
          ETCD_ENABLE_V2="true"
          ETCD_LISTEN_CLIENT_URLS="http://0.0.0.0:{{ etcd_client_port }}"
          ETCD_ADVERTISE_CLIENT_URLS="http://{{ ansible_host }}:{{ etcd_client_port }}"
          ETCD_LISTEN_PEER_URLS="http://{{ ansible_host }}:{{ etcd_peer_port }}"
          ETCD_INITIAL_ADVERTISE_PEER_URLS="http://{{ ansible_host }}:{{ etcd_peer_port }}"
          ETCD_INITIAL_CLUSTER="{{ etcd_name }}=http://{{ ansible_host }}:{{ etcd_peer_port }}"
          ETCD_INITIAL_CLUSTER_TOKEN="project-postgres-cluster"
          ETCD_INITIAL_CLUSTER_STATE="new"
      notify: Restart etcd

    - name: Enable and start etcd
      ansible.builtin.systemd:
        name: etcd
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart etcd
      ansible.builtin.systemd:
        name: etcd
        state: restarted
        daemon_reload: true


- name: Install PostgreSQL and Patroni on DB nodes
  hosts: patroni_servers
  become: true
  gather_facts: true
  serial: 1

  vars_files:
    - group_vars/group/all/vault.yml

  vars:
    patroni_cluster_name: project-postgres
    patroni_rest_port: 8008
    patroni_data_dir: /var/lib/postgresql/patroni-main
    patroni_etcd_host: "{{ hostvars[groups['etcd_servers'][0]].ansible_host }}"
    patroni_allowed_networks:
      - 192.168.72.0/27
      - 192.168.73.0/27
      - 192.168.74.0/27
    postgres_app_database: shopdb
    postgres_app_user: appuser
    postgres_replication_user: replicator

  pre_tasks:
    - name: Check database Vault variables
      ansible.builtin.assert:
        that:
          - vault_postgres_superuser_password is defined
          - vault_postgres_replication_password is defined
          - vault_postgres_app_password is defined
        fail_msg: Add vault_postgres_superuser_password, vault_postgres_replication_password and vault_postgres_app_password to group_vars/group/all/vault.yml.
      no_log: true

  tasks:
    - name: Install PostgreSQL and Patroni packages
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-client
          - postgresql-contrib
          - patroni
          - python3-psycopg2
          - python3-etcd
          - python3-etcd3gw
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Find installed PostgreSQL version
      ansible.builtin.shell: "ls -1 /usr/lib/postgresql | sort -V | tail -n 1"
      register: postgresql_version
      changed_when: false

    - name: Stop default PostgreSQL service
      ansible.builtin.systemd:
        name: postgresql
        state: stopped
        enabled: false
      failed_when: false

    - name: Create Patroni configuration directory
      ansible.builtin.file:
        path: /etc/patroni
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create Patroni data directory
      ansible.builtin.file:
        path: "{{ patroni_data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: Configure Patroni
      ansible.builtin.copy:
        dest: /etc/patroni/config.yml
        owner: root
        group: postgres
        mode: "0640"
        content: |
          scope: {{ patroni_cluster_name }}
          namespace: /service/
          name: {{ inventory_hostname }}

          restapi:
            listen: {{ ansible_host }}:{{ patroni_rest_port }}
            connect_address: {{ ansible_host }}:{{ patroni_rest_port }}

          etcd:
            host: {{ patroni_etcd_host }}:2379

          bootstrap:
            dcs:
              ttl: 30
              loop_wait: 10
              retry_timeout: 10
              maximum_lag_on_failover: 1048576
              postgresql:
                use_pg_rewind: true
                parameters:
                  wal_level: replica
                  hot_standby: "on"
                  wal_keep_size: 256MB
                  max_wal_senders: 10
                  max_replication_slots: 10
            initdb:
              - encoding: UTF8
              - data-checksums
            pg_hba:
              - local all all peer
              - host all all 127.0.0.1/32 scram-sha-256
          {% for network in patroni_allowed_networks %}
              - host all all {{ network }} scram-sha-256
              - host replication {{ postgres_replication_user }} {{ network }} scram-sha-256
          {% endfor %}
            users:
              {{ postgres_app_user }}:
                password: {{ vault_postgres_app_password | to_json }}
                options:
                  - login

          postgresql:
            listen: {{ ansible_host }}:5432
            connect_address: {{ ansible_host }}:5432
            data_dir: {{ patroni_data_dir }}
            bin_dir: /usr/lib/postgresql/{{ postgresql_version.stdout }}/bin
            pgpass: /tmp/pgpass
            authentication:
              superuser:
                username: postgres
                password: {{ vault_postgres_superuser_password | to_json }}
              replication:
                username: {{ postgres_replication_user }}
                password: {{ vault_postgres_replication_password | to_json }}
            parameters:
              unix_socket_directories: /var/run/postgresql

          tags:
            nofailover: false
            noloadbalance: false
            clonefrom: false
            nosync: false
      no_log: true
      notify: Restart Patroni

    - name: Enable and start Patroni
      ansible.builtin.systemd:
        name: patroni
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart Patroni
      ansible.builtin.systemd:
        name: patroni
        state: restarted
        daemon_reload: true


- name: Create application database on current Patroni primary
  hosts: patroni_servers
  become: true
  gather_facts: false

  vars_files:
    - group_vars/group/all/vault.yml

  vars:
    postgres_app_database: shopdb
    postgres_app_user: appuser

  tasks:
    - name: Check Patroni primary API on this node
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8008/primary"
        status_code:
          - 200
          - 503
      register: patroni_primary_check
      failed_when: false
      changed_when: false

    - name: Mark current PostgreSQL primary
      ansible.builtin.set_fact:
        is_postgres_primary: "{{ patroni_primary_check.status | default(0) | int == 200 }}"

    - name: Create or update application database user on primary
      ansible.builtin.shell: |
        set -eu
        export PGPASSWORD={{ vault_postgres_superuser_password | quote }}
        psql -h {{ ansible_host }} -U postgres -v ON_ERROR_STOP=1 \
          -v app_user={{ postgres_app_user | quote }} \
          -v app_password={{ vault_postgres_app_password | quote }} <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec

        SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'app_user', :'app_password') \gexec
        SQL
      when: is_postgres_primary
      no_log: true
      changed_when: false

    - name: Create application database on primary
      ansible.builtin.shell: |
        set -eu
        export PGPASSWORD={{ vault_postgres_superuser_password | quote }}
        psql -h {{ ansible_host }} -U postgres -v ON_ERROR_STOP=1 \
          -v db_name={{ postgres_app_database | quote }} \
          -v app_user={{ postgres_app_user | quote }} <<'SQL'
        SELECT format('CREATE DATABASE %I OWNER %I', :'db_name', :'app_user')
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'db_name') \gexec

        SELECT format('ALTER DATABASE %I OWNER TO %I', :'db_name', :'app_user') \gexec
        SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'db_name', :'app_user') \gexec
        SQL
      when: is_postgres_primary
      no_log: true
      changed_when: false

    - name: Configure application table and permissions on primary
      ansible.builtin.shell: |
        set -eu
        export PGPASSWORD={{ vault_postgres_superuser_password | quote }}
        psql -h {{ ansible_host }} -U postgres -d "{{ postgres_app_database }}" -v ON_ERROR_STOP=1 \
          -v app_user={{ postgres_app_user | quote }} <<'SQL'
        CREATE TABLE IF NOT EXISTS public.products (
          id SERIAL PRIMARY KEY,
          name VARCHAR(255) NOT NULL,
          price NUMERIC(10, 2) NOT NULL,
          stock INTEGER NOT NULL DEFAULT 0,
          image_key VARCHAR(512)
        );

        SELECT format('ALTER TABLE public.products OWNER TO %I', :'app_user') \gexec
        SELECT format('ALTER SEQUENCE IF EXISTS public.products_id_seq OWNER TO %I', :'app_user') \gexec

        SELECT format('GRANT USAGE, CREATE ON SCHEMA public TO %I', :'app_user') \gexec
        SELECT format('GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.products TO %I', :'app_user') \gexec
        SELECT format('GRANT USAGE, SELECT, UPDATE ON SEQUENCE public.products_id_seq TO %I', :'app_user') \gexec

        SELECT format('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I', :'app_user') \gexec
        SELECT format('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO %I', :'app_user') \gexec
        SQL
      when: is_postgres_primary
      no_log: true
      changed_when: false

    - name: Show Patroni cluster status
      ansible.builtin.command:
        argv:
          - patronictl
          - -c
          - /etc/patroni/config.yml
          - list
      register: patroni_cluster_status
      changed_when: false

    - name: Print Patroni cluster status
      ansible.builtin.debug:
        var: patroni_cluster_status.stdout_lines
