apiVersion: 1
policies:
- orgId: 1
  receiver: telegram
  group_by:
  - alertname
  - instance
  - host
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 6h
  routes:
  - receiver: telegram
    object_matchers:
    - - severity
      - '='
      - critical
    group_wait: 10s
    repeat_interval: 1h
