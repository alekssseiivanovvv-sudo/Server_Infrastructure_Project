# Reuse upstream OpenSSH failure patterns, including publickey=any.
# BusyBox syslog prefixes include a facility between hostname and daemon:
# Oct 30 12:00:00 east-router auth.info sshd-session[123]: Failed ...
[INCLUDES]
before = sshd.conf

[DEFAULT]
_daemon = sshd(?:-session)?
__prefix_line = \s*(?:<__hostname>\s+)?(?:[a-z0-9]+\.[a-z]+\s+)?<__daemon_combs_re>\s+
