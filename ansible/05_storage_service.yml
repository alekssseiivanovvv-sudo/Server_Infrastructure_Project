---
- name: Install and configure SeaweedFS storage
  hosts: s3_servers
  become: true
  gather_facts: true

  vars_files:
    - group_vars/group/all/vault.yml

  vars:
    seaweedfs_version: "4.48"
    seaweed_admin_user: seaweed_sysuser
    seaweed_enable_sync: false
    seaweed_data_dir: /srv/seaweedfs
    seaweed_volume_max: 20
    seaweed_s3_config_dir: /etc/seaweedfs
    seaweed_s3_config_file: /etc/seaweedfs/s3.json

  roles:
    - seaweedfs

  post_tasks:
    - name: Create SeaweedFS config directory
      ansible.builtin.file:
        path: "{{ seaweed_s3_config_dir }}"
        state: directory
        owner: root
        group: "{{ seaweed_admin_user }}"
        mode: "0750"

    - name: Configure SeaweedFS S3 credentials
      ansible.builtin.copy:
        dest: "{{ seaweed_s3_config_file }}"
        owner: root
        group: "{{ seaweed_admin_user }}"
        mode: "0640"
        content: |
          {
            "identities": [
              {
                "name": "shop-app",
                "credentials": [
                  {
                    "accessKey": "{{ vault_shop_seaweed_access_key }}",
                    "secretKey": "{{ vault_shop_seaweed_secret_key }}"
                  }
                ],
                "actions": [
                  "Admin",
                  "Read",
                  "Write",
                  "List",
                  "Tagging"
                ],
                "resources": [
                  "buckets/product-images",
                  "buckets/product-images/*"
                ]
              }
            ]
          }
      no_log: true

    - name: Configure SeaweedFS S3 service with authentication
      ansible.builtin.copy:
        dest: /etc/systemd/system/seaweed-s3.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=SeaweedFS S3 {{ inventory_hostname }}
          After=network-online.target seaweed-filer.service
          Wants=network-online.target

          [Service]
          User={{ seaweed_admin_user }}
          Group={{ seaweed_admin_user }}
          ExecStart=/usr/local/bin/weed s3 -filer={{ ansible_host }}:8888 -ip.bind={{ ansible_host }} -port=8333 -config={{ seaweed_s3_config_file }}
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart SeaweedFS S3 service
      ansible.builtin.systemd:
        name: seaweed-s3
        enabled: true
        state: restarted
