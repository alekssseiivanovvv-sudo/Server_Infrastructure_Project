---
- name: Refuse implicit migration from etcd v2
  hosts: patroni_servers
  become: true
  gather_facts: false
  tasks:
    - name: Inspect existing Patroni configuration
      ansible.builtin.stat:
        path: /etc/patroni/config.yml
      register: old_patroni_config
    - name: Read existing configuration
      ansible.builtin.slurp:
        src: /etc/patroni/config.yml
      register: old_patroni_content
      when: old_patroni_config.stat.exists
      no_log: true
    - name: Refuse changing an existing v2 cluster in-place
      ansible.builtin.assert:
        that:
          - "'etcd' not in (old_patroni_content.content | b64decode | from_yaml)"
        fail_msg: 'Existing etcd v2 cluster detected. Follow README migration using NEW VMs; do not delete PostgreSQL data.'
      when: old_patroni_config.stat.exists
      no_log: true

- name: Configure etcd v3 members
  hosts: etcd_servers
  become: true
  gather_facts: true
  tasks:
    - name: Require Ubuntu and supported cluster size
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - groups['etcd_servers'] | length in [1, 3]
    - name: Install etcd
      ansible.builtin.apt:
        name: [etcd-server, etcd-client]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Create data directory
      ansible.builtin.file:
        path: "{{ etcd_data_dir }}"
        state: directory
        owner: etcd
        group: etcd
        mode: '0700'
    - name: Configure etcd
      ansible.builtin.template:
        src: templates/etcd.env.j2
        dest: /etc/default/etcd-project
        mode: '0644'
      notify: Restart etcd
    - name: Install explicit etcd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/etcd.service
        mode: '0644'
        content: |
          [Unit]
          Description=Project etcd v3
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=etcd
          Group=etcd
          EnvironmentFile=/etc/default/etcd-project
          ExecStart=/usr/bin/etcd
          Restart=on-failure
          RestartSec=5
          LimitNOFILE=65536
          [Install]
          WantedBy=multi-user.target
      notify: Restart etcd
    - name: Enable etcd
      ansible.builtin.systemd:
        name: etcd
        enabled: true
        state: started
        daemon_reload: true
    - name: Apply configuration on all members before checking quorum
      ansible.builtin.meta: flush_handlers
    - name: Wait for healthy etcd v3 endpoint
      ansible.builtin.command: etcdctl --endpoints=http://127.0.0.1:2379 endpoint health
      environment:
        ETCDCTL_API: '3'
      register: etcd_health
      until: etcd_health.rc == 0
      retries: 30
      delay: 3
      changed_when: false
  handlers:
    - name: Restart etcd
      ansible.builtin.systemd:
        name: etcd
        state: restarted
        daemon_reload: true

- name: Configure PostgreSQL and Patroni
  hosts: patroni_servers
  become: true
  gather_facts: true
  serial: 1
  vars_files:
    - group_vars/group/all/vault.yml
  tasks:
    - name: Check required credentials
      ansible.builtin.assert:
        that:
          - vault_postgres_superuser_password | default('') | length > 0
          - vault_postgres_replication_password | default('') | length > 0
          - vault_postgres_app_password | default('') | length > 0
          - vault_postgres_backup_password | default('') | length > 0
          - vault_patroni_api_password | default('') | length > 0
      no_log: true
    - name: Install PostgreSQL and Patroni
      ansible.builtin.apt:
        name:
          - "postgresql-{{ postgres_major_version }}"
          - "postgresql-client-{{ postgres_major_version }}"
          - patroni
          - python3-psycopg2
          - python3-etcd
          - python3-etcd3gw
          - sudo
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Stop and mask distribution-managed default cluster
      ansible.builtin.systemd:
        name: "postgresql@{{ postgres_major_version }}-main.service"
        state: stopped
        enabled: false
        masked: true
    - name: Stop distribution PostgreSQL umbrella service
      ansible.builtin.systemd:
        name: postgresql
        state: stopped
        enabled: false
    - name: Create Patroni configuration directory
      ansible.builtin.file:
        path: /etc/patroni
        state: directory
        mode: '0750'
        owner: root
        group: postgres
    - name: Create PostgreSQL data directory
      ansible.builtin.file:
        path: "{{ patroni_data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'
    - name: Install Patroni configuration
      ansible.builtin.template:
        src: templates/patroni.yml.j2
        dest: /etc/patroni/config.yml
        owner: root
        group: postgres
        mode: '0640'
      no_log: true
      notify: Restart Patroni
    - name: Install explicit Patroni systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/patroni.service
        mode: '0644'
        content: |
          [Unit]
          Description=Project Patroni
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=postgres
          Group=postgres
          RuntimeDirectory=postgresql
          RuntimeDirectoryMode=2775
          ExecStart=/usr/bin/patroni /etc/patroni/config.yml
          KillMode=process
          TimeoutStopSec=120
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
      notify: Restart Patroni
    - name: Enable Patroni
      ansible.builtin.systemd:
        name: patroni
        enabled: true
        state: started
        daemon_reload: true
    - name: Apply configuration before waiting
      ansible.builtin.meta: flush_handlers
    - name: Wait for a healthy PostgreSQL process on this node
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8008/health"
        status_code: 200
      register: node_health
      until: node_health.status | default(0) == 200
      retries: 60
      delay: 5
    - name: Wait for node to become a primary or streaming replica
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8008/patroni"
        status_code: 200
      register: node_state
      until: >-
        node_state.status | default(0) == 200 and
        node_state.json.state | default('') == 'running' and
        (node_state.json.role | default('') in ['primary', 'master'] or
         (node_state.json.role | default('') == 'replica' and
          node_state.json.replication_state | default('') == 'streaming'))
      retries: 60
      delay: 5
  handlers:
    - name: Restart Patroni
      ansible.builtin.systemd:
        name: patroni
        state: restarted
        daemon_reload: true

- name: Create application database on current Patroni primary
  hosts: patroni_servers
  become: true
  gather_facts: false

  vars_files:
    - group_vars/group/all/vault.yml

  vars:
    postgres_app_database: shopdb
    postgres_app_user: appuser

  tasks:
    - name: Read current primary status
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8008/primary"
        status_code: [200, 503]
      register: patroni_primary_check
      changed_when: false

    - name: Mark primary
      ansible.builtin.set_fact:
        is_postgres_primary: "{{ patroni_primary_check.status | int == 200 }}"

    - name: Require exactly one primary before changing SQL objects
      ansible.builtin.assert:
        that:
          - groups['patroni_servers'] | map('extract', hostvars, 'is_postgres_primary') | select('equalto', true) | list | length == 1
      run_once: true

    - name: Create or update application database user on primary
      ansible.builtin.shell: |
        set -eu
        sudo -u postgres psql -h /var/run/postgresql -U postgres -v ON_ERROR_STOP=1 \
          -v app_user={{ postgres_app_user | quote }} \
          -v app_password={{ vault_postgres_app_password | quote }} <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec

        SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'app_user', :'app_password') \gexec
        SQL
      when: is_postgres_primary
      no_log: true
      changed_when: false

    - name: Create application database on primary
      ansible.builtin.shell: |
        set -eu
        sudo -u postgres psql -h /var/run/postgresql -U postgres -v ON_ERROR_STOP=1 \
          -v db_name={{ postgres_app_database | quote }} \
          -v app_user={{ postgres_app_user | quote }} <<'SQL'
        SELECT format('CREATE DATABASE %I OWNER %I', :'db_name', :'app_user')
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'db_name') \gexec

        SELECT format('ALTER DATABASE %I OWNER TO %I', :'db_name', :'app_user') \gexec
        SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'db_name', :'app_user') \gexec
        SQL
      when: is_postgres_primary
      no_log: true
      changed_when: false

    - name: Configure application table and permissions on primary
      ansible.builtin.shell: |
        set -eu
        sudo -u postgres psql -h /var/run/postgresql -U postgres -d "{{ postgres_app_database }}" -v ON_ERROR_STOP=1 \
          -v app_user={{ postgres_app_user | quote }} <<'SQL'
        CREATE TABLE IF NOT EXISTS public.products (
          id SERIAL PRIMARY KEY,
          name VARCHAR(255) NOT NULL,
          price NUMERIC(10, 2) NOT NULL,
          stock INTEGER NOT NULL DEFAULT 0,
          image_key VARCHAR(512)
        );

        SELECT format('ALTER TABLE public.products OWNER TO %I', :'app_user') \gexec
        SELECT format('ALTER SEQUENCE IF EXISTS public.products_id_seq OWNER TO %I', :'app_user') \gexec

        SELECT format('GRANT USAGE, CREATE ON SCHEMA public TO %I', :'app_user') \gexec
        SELECT format('GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.products TO %I', :'app_user') \gexec
        SELECT format('GRANT USAGE, SELECT, UPDATE ON SEQUENCE public.products_id_seq TO %I', :'app_user') \gexec

        SELECT format('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I', :'app_user') \gexec
        SELECT format('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO %I', :'app_user') \gexec
        SQL
      when: is_postgres_primary
      no_log: true
      changed_when: false

    - name: Create dedicated read-only backup role on primary
      ansible.builtin.shell: |
        set -eu
        sudo -u postgres psql -h /var/run/postgresql -v ON_ERROR_STOP=1 \
          -v role={{ postgres_backup_user | quote }} \
          -v password={{ vault_postgres_backup_password | quote }} \
          -v db={{ postgres_app_database | quote }} <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', :'role')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role') \gexec
        SELECT format('ALTER ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD %L', :'role', :'password') \gexec
        SELECT format('GRANT pg_read_all_data TO %I', :'role') \gexec
        SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'db', :'role') \gexec
        SQL
      when: is_postgres_primary
      no_log: true
      changed_when: false

    - name: Show Patroni cluster status
      ansible.builtin.command:
        argv:
          - patronictl
          - -c
          - /etc/patroni/config.yml
          - list
      register: patroni_cluster_status
      changed_when: false

    - name: Print Patroni cluster status
      ansible.builtin.debug:
        var: patroni_cluster_status.stdout_lines
