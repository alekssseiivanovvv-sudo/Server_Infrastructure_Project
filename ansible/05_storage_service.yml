---
- name: Install and configure SeaweedFS storage
  hosts: seaweed_master_servers
  become: true
  gather_facts: true

  vars_files:
    - group_vars/group/all/vault.yml

  vars:
    seaweedfs_version: "4.48"
    seaweed_admin_user: seaweed_sysuser
    seaweed_primary_host: east_storage
    seaweed_secondary_host: west_storage
    seaweed_data_dir: /srv/storage/seaweed
    seaweed_volume_max: 20
    seaweed_master_peers: >-
      {{
        groups['seaweed_master_servers']
        | map('extract', hostvars, 'ansible_host')
        | map('regex_replace', '$', ':9333')
        | join(',')
      }}

  roles:
    - seaweedfs
