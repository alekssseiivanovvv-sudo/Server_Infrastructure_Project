---
- name: Apply SeaweedFS configuration before bucket initialization
  ansible.builtin.meta: flush_handlers

- name: Wait for S3 TCP listener
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 8333
    timeout: 120

- name: Wait for authenticated S3 API
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "-"
    stdin: |
      import os
      import boto3
      from botocore.config import Config

      client = boto3.client(
          "s3",
          endpoint_url=os.environ["S3_ENDPOINT"],
          aws_access_key_id=os.environ["S3_ACCESS_KEY"],
          aws_secret_access_key=os.environ["S3_SECRET_KEY"],
          region_name="us-east-1",
          config=Config(
              signature_version="s3v4",
              s3={"addressing_style": "path"},
              connect_timeout=5,
              read_timeout=5,
              retries={"max_attempts": 0},
          ),
      )

      client.list_buckets()
  environment:
    S3_ENDPOINT: "http://{{ ansible_host }}:8333"
    S3_ACCESS_KEY: "{{ vault_seaweed_admin_access_key }}"
    S3_SECRET_KEY: "{{ vault_seaweed_admin_secret_key }}"
  register: seaweed_s3_ready
  until: seaweed_s3_ready.rc == 0
  retries: 24
  delay: 5
  changed_when: false
  no_log: true

- name: Create product-images bucket if absent
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "-"
    stdin: |
      import os
      import boto3
      from botocore.config import Config
      from botocore.exceptions import ClientError

      client = boto3.client(
          "s3",
          endpoint_url=os.environ["S3_ENDPOINT"],
          aws_access_key_id=os.environ["S3_ACCESS_KEY"],
          aws_secret_access_key=os.environ["S3_SECRET_KEY"],
          region_name="us-east-1",
          config=Config(
              signature_version="s3v4",
              s3={"addressing_style": "path"},
              connect_timeout=5,
              read_timeout=30,
              retries={"max_attempts": 2},
          ),
      )

      bucket = "product-images"

      try:
          client.head_bucket(Bucket=bucket)
      except ClientError as exc:
          status = exc.response["ResponseMetadata"]["HTTPStatusCode"]
          if status != 404:
              raise
          client.create_bucket(Bucket=bucket)
          print("created")
      else:
          print("exists")
  environment:
    S3_ENDPOINT: "http://{{ ansible_host }}:8333"
    S3_ACCESS_KEY: "{{ vault_seaweed_admin_access_key }}"
    S3_SECRET_KEY: "{{ vault_seaweed_admin_secret_key }}"
  register: seaweed_bucket_result
  changed_when: seaweed_bucket_result.stdout | trim == "created"
  no_log: true

- name: Verify application credentials can access product-images
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "-"
    stdin: |
      import os
      import boto3
      from botocore.config import Config

      client = boto3.client(
          "s3",
          endpoint_url=os.environ["S3_ENDPOINT"],
          aws_access_key_id=os.environ["S3_ACCESS_KEY"],
          aws_secret_access_key=os.environ["S3_SECRET_KEY"],
          region_name="us-east-1",
          config=Config(
              signature_version="s3v4",
              s3={"addressing_style": "path"},
              connect_timeout=5,
              read_timeout=10,
              retries={"max_attempts": 2},
          ),
      )

      client.list_objects_v2(
          Bucket="product-images",
          MaxKeys=1,
      )
  environment:
    S3_ENDPOINT: "http://{{ ansible_host }}:8333"
    S3_ACCESS_KEY: "{{ vault_shop_seaweed_access_key }}"
    S3_SECRET_KEY: "{{ vault_shop_seaweed_secret_key }}"
  changed_when: false
  no_log: true

- name: Report S3 initialization result
  ansible.builtin.debug:
    msg: >-
      Bucket product-images
      {{ 'created' if seaweed_bucket_result.stdout | trim == 'created'
         else 'already exists' }}.
      Application credentials verified.
