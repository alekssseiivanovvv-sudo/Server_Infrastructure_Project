---
  - name: Prepare automation accound on hypervisor hosts
    hosts: hypervisor_hosts
    become: true
    gather_facts: false
    serial: 1

    vars_files:
      - group_vars/group/all/vault.yml

    vars:
      ansible_user: "{{ bootstrap_user | default('ansible_admin') }}"
      selected_admin_users: >-
        {{
          vault_admin_users
          | selectattr('name', 'equalto', 'ansible_admin')
          | list
        }}
    tasks:

      - name: Create ansible_admin
      ansible.builtin.user:
        name: "{{ item.name }}"
        password: "{{ item.password_hash }}"
        update_password: always
        shell: /bin/bash
        groups:
          - sudo
        append: true
        create_home: true
        state: present
      loop: "{{ selected_admin_users }}"
      no_log: true

      - name: Configure passwordless sudo for ansible_admin
      ansible.builtin.copy:
        dest: /etc/sudoers.d/99-ansible-admin
        owner: root
        group: root
        mode: '0440'
        content: |
          # managed by Ansible
          ansible_admin ALL=(ALL:ALL) NOPASSWD: ALL
        validate: /usr/sbin/visudo -cf %s

      - name: Verify ansible admin and SSH
        hosts: hypervisor_hosts
        become: true
        gather_facts: false
        serial: 1
        any_errors_fatal: true

        vars:
          ansible_user: ansible_admin
          ansible_password: ""
          ansible_become_password: ""

          ansible_ssh_extra_args: >-
            -o PrefferedAuthentifications=publickey
            -o PasswordAuthentification=no
            -o KbdInteractiveAuthentification=no

        tasks:
          - name: Close existing SSH connection
            ansible.builtin.meta: reset connection

          - name: Check SSH connection and passwordless sudo
            ansible.builtin.command: sudo -n id -u
            register: sudo check
            changed_when: false
            failed_when: sudo_check.stdout != '0'

          - name: Configure SSH
            ansible.builtin.include_role:
              name: automation_sshd
              apply:
                become: true
