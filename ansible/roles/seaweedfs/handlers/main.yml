---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart SeaweedFS
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - seaweed-master
    - seaweed-volume
    - seaweed-filer
    - seaweed-s3

- name: Restart SeaweedFS S3
  ansible.builtin.systemd:
    name: seaweed-s3
    state: restarted
    daemon_reload: true
