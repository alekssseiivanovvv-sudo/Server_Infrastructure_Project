---
- name: Configure firewall and DNS on project routers
  hosts: routers
  become: true
  gather_facts: true

  vars_files:
    - group_vars/group/all/vault.yml

  roles:
    - router_firewall
    - role: router_fail2ban
      tags: [fail2ban]
    - router_dns


- name: Configure project DNS on internal virtual machines
  hosts: "infrastructure:!routers"
  become: true
  gather_facts: true

  vars_files:
    - group_vars/group/all/vault.yml
  roles:
    - project_dns_client


- name: Configure local firewall on virtual machines
  hosts: linux_servers
  become: true
  gather_facts: true

  vars_files:
    - group_vars/group/all/vault.yml

  roles:
    - host_firewall
