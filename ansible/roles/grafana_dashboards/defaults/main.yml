---
# Директории Grafana
grafana_provisioning_dir: /etc/grafana/provisioning
grafana_dashboards_dir: /var/lib/grafana/dashboards

# Дашборды проекта (лежат в files/dashboards/ внутри роли).
# Имя файла = uid дашборда.
grafana_dashboard_files:
  - alloy-host-overview.json   # метрики хостов (Prometheus)
  - alloy-logs-overview.json   # ошибки и логи (Loki)

# Удалять из grafana_dashboards_dir все *.json, которых нет в списке выше
# (чистит ранее скачанные дашборды). Grafana сама уберёт их из UI.
grafana_dashboards_purge_unmanaged: true

# Хвосты старой версии роли в /tmp на целевом хосте (скачивание + фикс-скрипт)
grafana_legacy_tmp_files:
  - /tmp/fix_dashboards.py
  - /tmp/alloy-controller.json
  - /tmp/alloy-cluster-overview.json
  - /tmp/alloy-loki.json
  - /tmp/alloy-otel-engine-overview.json
  - /tmp/alloy-prometheus.json
  - /tmp/loki-logs.json
  - /tmp/docker-cadvisor.json
  - /tmp/postgresql.json
