---
- name: Configure web worker nodes
  hosts: web_servers
  become: true
  gather_facts: true

  vars_files:
    - group_vars/group/all/vault.yml

  vars:
    shop_web_dir: /opt/shop-web
    shop_db_host: 192.168.74.4
    shop_db_port: 5000
    shop_db_name: shopdb
    shop_db_user: appuser
    shop_s3_bucket: product-images

  tasks:
    - name: Check that web workers are Alpine
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Alpine"
        fail_msg: "Web worker nodes must be Alpine Linux."

    - name: Install Docker packages
      ansible.builtin.apk:
        name:
          - docker
          - docker-cli-compose
          - curl
        state: present
        update_cache: true

    - name: Enable Docker service
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Create shop web directory
      ansible.builtin.file:
        path: "{{ shop_web_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy shop web project
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/shop-web/"
        dest: "{{ shop_web_dir }}/"
        owner: root
        group: root
        mode: preserve

    - name: Add backend health endpoint
      ansible.builtin.blockinfile:
        path: "{{ shop_web_dir }}/backend/app.py"
        marker: "# {mark} ANSIBLE MANAGED HEALTH ENDPOINT"
        insertbefore: "^if __name__ == '__main__':"
        block: |

          @app.route('/health')
          def health():
              return jsonify({"status": "ok"}), 200

    - name: Configure NGINX for shop web
      ansible.builtin.copy:
        dest: "{{ shop_web_dir }}/nginx/nginx.conf"
        owner: root
        group: root
        mode: "0644"
        content: |
          events {
              worker_connections 1024;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              upstream backend_servers {
                  server backend:5000;
              }

              server {
                  listen 80;
                  server_name _;

                  root /usr/share/nginx/html;
                  index index.html;

                  location /health {
                      proxy_pass http://backend_servers/health;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  }

                  location /api/ {
                      proxy_pass http://backend_servers;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  }

                  location /images/ {
                      proxy_pass http://backend_servers/api/image/;
                      proxy_set_header Host $host;
                  }

                  location / {
                      try_files $uri $uri/ /index.html;
                  }
              }
          }

    - name: Configure Docker Compose
      ansible.builtin.copy:
        dest: "{{ shop_web_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"
        content: |
          services:
            backend:
              build: ./backend
              container_name: python-backend
              env_file:
                - .env
              restart: unless-stopped

            nginx:
              build: ./nginx
              container_name: nginx-web
              ports:
                - "80:80"
              volumes:
                - ./html:/usr/share/nginx/html:ro
              depends_on:
                - backend
              restart: unless-stopped

    - name: Configure shop environment
      ansible.builtin.copy:
        dest: "{{ shop_web_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
        content: |
          DB_HOST={{ shop_db_host }}
          DB_PORT={{ shop_db_port }}
          DB_NAME={{ shop_db_name }}
          DB_USER={{ shop_db_user }}
          DB_PASS={{ vault_shop_db_password }}

          SEAWEED_ENDPOINT=http://{{ '192.168.72.4' if inventory_hostname == 'east_web' else '192.168.73.4' }}:8333
          SEAWEED_ACCESS_KEY={{ vault_shop_seaweed_access_key }}
          SEAWEED_SECRET_KEY={{ vault_shop_seaweed_secret_key }}
          SEAWEED_BUCKET={{ shop_s3_bucket }}
      no_log: true

    - name: Validate Docker Compose config
      ansible.builtin.command: docker compose config
      args:
        chdir: "{{ shop_web_dir }}"
      changed_when: false

    - name: Build and start shop web containers
      ansible.builtin.command: docker compose up -d --build
      args:
        chdir: "{{ shop_web_dir }}"

    - name: Check local web health
      ansible.builtin.uri:
        url: "http://127.0.0.1/health"
        status_code: 200


- name: Configure HAProxy load balancer
  hosts: balance_servers
  become: true
  gather_facts: true

  vars_files:
    - group_vars/group/all/vault.yml

  tasks:
    - name: Check that load balancer is Alpine
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Alpine"
        fail_msg: "Load balancer must be Alpine Linux."

    - name: Install HAProxy
      ansible.builtin.apk:
        name:
          - haproxy
          - curl
        state: present
        update_cache: true

    - name: Configure HAProxy
      ansible.builtin.copy:
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
        validate: "haproxy -c -f %s"
        content: |
          global
              log /dev/log local0
              log /dev/log local1 notice
              maxconn 4096
              user haproxy
              group haproxy
              daemon

          defaults
              log global
              option dontlognull
              timeout connect 5s
              timeout client 30s
              timeout server 30s

          frontend http_front
              bind *:80
              mode http
              option httplog
              option forwardfor
              default_backend nginx_servers

          backend nginx_servers
              mode http
              balance roundrobin
              option httpchk GET /health
              http-check expect status 200
              server nginx_east 192.168.72.2:80 check inter 3s fall 3 rise 2
              server nginx_west 192.168.73.2:80 check inter 3s fall 3 rise 2

          listen stats
              bind *:8404
              mode http
              stats enable
              stats uri /stats
              stats refresh 5s
              stats auth {{ vault_haproxy_stats_user }}:{{ vault_haproxy_stats_password }}

          frontend postgres_front
              bind *:5000
              mode tcp
              option tcplog
              default_backend postgres_primary

          backend postgres_primary
              mode tcp
              option httpchk GET /primary
              http-check expect status 200
              default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
              server pg_east 192.168.72.3:5432 check port 8008
              server pg_west 192.168.73.3:5432 check port 8008
      no_log: true

    - name: Enable and restart HAProxy
      ansible.builtin.service:
        name: haproxy
        enabled: true
        state: restarted

    - name: Check HAProxy web frontend
      ansible.builtin.uri:
        url: "http://127.0.0.1/health"
        status_code: 200

    - name: Check HAProxy stats page
      ansible.builtin.uri:
        url: "http://127.0.0.1:8404/stats"
        user: "{{ vault_haproxy_stats_user }}"
        password: "{{ vault_haproxy_stats_password }}"
        force_basic_auth: true
        status_code: 200
      no_log: true
