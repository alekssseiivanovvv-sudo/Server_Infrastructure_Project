---
- name: Ensure provisioning directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: '0755'
  loop:
    - "{{ grafana_provisioning_dir }}/datasources"
    - "{{ grafana_provisioning_dir }}/dashboards"
    - "{{ grafana_dashboards_dir }}"

- name: Deploy datasource provisioning config
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: "{{ grafana_provisioning_dir }}/datasources/ansible.yml"
    owner: grafana
    group: grafana
    mode: '0640'
  notify: Restart Grafana

- name: Deploy dashboard provider config
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: "{{ grafana_provisioning_dir }}/dashboards/ansible.yml"
    owner: grafana
    group: grafana
    mode: '0640'
  notify: Restart Grafana

- name: Remove old/conflicting provisioning files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ grafana_provisioning_dir }}/datasources/project.yml"
    - "{{ grafana_provisioning_dir }}/datasources/sample.yaml"
    - "{{ grafana_provisioning_dir }}/datasources/datasource.yaml"
  notify: Restart Grafana

# ------------------------------------------------------------------
# Скачиваем дашборды Alloy по прямым URL
# ------------------------------------------------------------------
- name: Download Alloy mixin dashboards from GitHub
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/tmp/{{ item.name }}.json"
    mode: '0644'
    force: true
  loop: "{{ grafana_url_dashboards }}"
  register: alloy_downloaded

- name: Replace datasource placeholders in Alloy dashboards
  ansible.builtin.replace:
    path: "/tmp/{{ item.item.name }}.json"
    regexp: '\$\{DS_[A-Z0-9_-]+\}'
    replace: "{{ item.item.datasource }}"
  loop: "{{ alloy_downloaded.results }}"
  when: item.changed

- name: Copy Alloy dashboards into Grafana directory
  ansible.builtin.copy:
    src: "/tmp/{{ item.name }}.json"
    dest: "{{ grafana_dashboards_dir }}/{{ item.name }}.json"
    remote_src: true
    owner: grafana
    group: grafana
    mode: '0644'
  loop: "{{ grafana_url_dashboards }}"
  notify: Restart Grafana

# ------------------------------------------------------------------
# Скачиваем дашборды с grafana.com по ID
# ------------------------------------------------------------------
- name: Download dashboards from grafana.com
  ansible.builtin.get_url:
    url: "https://grafana.com/api/dashboards/{{ item.id }}/revisions/latest/download"
    dest: "/tmp/{{ item.name }}.json"
    mode: '0644'
    force: true
  loop: "{{ grafana_dashboards }}"
  register: downloaded

- name: Replace datasource placeholders in downloaded dashboards
  ansible.builtin.replace:
    path: "/tmp/{{ item.item.name }}.json"
    regexp: '\$\{DS_[A-Z0-9_-]+\}'
    replace: "{{ item.item.datasource }}"
  loop: "{{ downloaded.results }}"
  when: item.changed

- name: Copy downloaded dashboards into Grafana directory
  ansible.builtin.copy:
    src: "/tmp/{{ item.name }}.json"
    dest: "{{ grafana_dashboards_dir }}/{{ item.name }}.json"
    remote_src: true
    owner: grafana
    group: grafana
    mode: '0644'
  loop: "{{ grafana_dashboards }}"
  notify: Restart Grafana

# ------------------------------------------------------------------
# Фикс-скрипт для дашбордов
# ------------------------------------------------------------------
- name: Copy dashboard fix script
  ansible.builtin.copy:
    src: fix_dashboards.py
    dest: /tmp/fix_dashboards.py
    mode: '0755'

- name: Apply dashboard fixes
  ansible.builtin.command:
    cmd: python3 /tmp/fix_dashboards.py {{ grafana_dashboards_dir }}
  register: fix_result
  changed_when: fix_result.stdout | length > 0
  notify: Restart Grafana

- name: Show fix script output
  ansible.builtin.debug:
    var: fix_result.stdout_lines
