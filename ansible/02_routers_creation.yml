- name: Create West router
  hosts: host_2
  become: true
  gather_facts: false

  vars_files:
    - group_vars/group/all/vault.yml

  vars:

    create_west: true

    router_name: west_router
    router_hostname: west-router
    router_instance_id: west-router-001

    # Пути пока неизвестны.
    router_image: "/mnt/disk/ISO/alpine-3.24.2-x86_64-cloudinit-r0.qcow2"
    router_directory: "/mnt/disk/VM/west_router"
    router_disk: "/mnt/disk/VM/west_router/west_router.qcow2"

    router_lan_address: 192.168.73.1
    router_lan_subnet: 192.168.73.0/27
    router_wan_mac: "52:54:00:73:01:01"
    router_lan_mac: "52:54:00:73:01:02"

  roles:
    - role: router_creation
      when: create_west | bool
