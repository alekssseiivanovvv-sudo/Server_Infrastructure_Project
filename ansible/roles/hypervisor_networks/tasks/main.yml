---
- name: Install libvirt
  ansible.builtin.apt:
    name: "{{ libvirt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Write internal network definition
  ansible.builtin.copy:
    dest: /tmp/lab-internal.xml
    mode: '0644'
    content: |
      <network>
        <name>internal</name>
        <bridge name='virbr-internal'/>
      </network>

- name: Reconnect after changing group membership
  ansible.builtin.meta: reset_connection

- name: Create and enable internal network if missing
  ansible.builtin.shell: |
    set -eu
    virsh -c qemu:///system net-define /tmp/lab-internal.xml
    virsh -c qemu:///system net-start internal
    virsh -c qemu:///system net-autostart internal
  args:
    creates: /etc/libvirt/qemu/networks/internal.xml

