---
- name: Check whether the application bucket exists
  ansible.builtin.command:
    argv:
      - /usr/local/bin/garage
      - bucket
      - info
      - "{{ garage_app_bucket_name }}"
  register: garage_app_bucket_info
  changed_when: false
  failed_when: garage_app_bucket_info.rc not in [0, 1]
  run_once: true
  delegate_to: "{{ garage_coordinator }}"

- name: Create the application bucket
  ansible.builtin.command:
    argv:
      - /usr/local/bin/garage
      - bucket
      - create
      - "{{ garage_app_bucket_name }}"
  changed_when: true
  when: garage_app_bucket_info.rc != 0
  run_once: true
  delegate_to: "{{ garage_coordinator }}"

- name: Set the application bucket quota
  ansible.builtin.command:
    argv:
      - /usr/local/bin/garage
      - bucket
      - set-quotas
      - --max-size
      - "{{ garage_app_bucket_max_size }}"
      - "{{ garage_app_bucket_name }}"
  changed_when: false
  run_once: true
  delegate_to: "{{ garage_coordinator }}"

- name: Check whether the application S3 key exists
  ansible.builtin.command:
    argv:
      - /usr/local/bin/garage
      - key
      - info
      - "{{ vault_garage_app_access_key }}"
  register: garage_app_key_info
  changed_when: false
  failed_when: garage_app_key_info.rc not in [0, 1]
  no_log: true
  run_once: true
  delegate_to: "{{ garage_coordinator }}"

- name: Import the application S3 key
  ansible.builtin.command:
    argv:
      - /usr/local/bin/garage
      - key
      - import
      - --yes
      - -n
      - "{{ garage_app_key_name }}"
      - "{{ vault_garage_app_access_key }}"
      - "{{ vault_garage_app_secret_key }}"
  changed_when: true
  when: garage_app_key_info.rc != 0
  no_log: true
  run_once: true
  delegate_to: "{{ garage_coordinator }}"

- name: Grant the application key access to the application bucket
  ansible.builtin.command:
    argv:
      - /usr/local/bin/garage
      - bucket
      - allow
      - --read
      - --write
      - "{{ garage_app_bucket_name }}"
      - --key
      - "{{ vault_garage_app_access_key }}"
  changed_when: false
  no_log: true
  run_once: true
  delegate_to: "{{ garage_coordinator }}"

- name: Check whether the monitoring bucket exists
  ansible.builtin.command:
    argv:
      - /usr/local/bin/garage
      - bucket
      - info
      - "{{ garage_loki_bucket_name }}"
  register: garage_loki_bucket_info
  changed_when: false
  failed_when: garage_loki_bucket_info.rc not in [0, 1]
  run_once: true
  delegate_to: "{{ garage_coordinator }}"

- name: Create the monitoring bucket
  ansible.builtin.command:
    argv:
      - /usr/local/bin/garage
      - bucket
      - create
      - "{{ garage_loki_bucket_name }}"
  changed_when: true
  when: garage_loki_bucket_info.rc != 0
  run_once: true
  delegate_to: "{{ garage_coordinator }}"

- name: Set the monitoring bucket quota
  ansible.builtin.command:
    argv:
      - /usr/local/bin/garage
      - bucket
      - set-quotas
      - --max-size
      - "{{ garage_loki_bucket_max_size }}"
      - "{{ garage_loki_bucket_name }}"
  changed_when: false
  when: garage_loki_bucket_max_size | string | length > 0
  run_once: true
  delegate_to: "{{ garage_coordinator }}"

- name: Check whether the Loki S3 key exists
  ansible.builtin.command:
    argv:
      - /usr/local/bin/garage
      - key
      - info
      - "{{ vault_garage_loki_access_key }}"
  register: garage_loki_key_info
  changed_when: false
  failed_when: garage_loki_key_info.rc not in [0, 1]
  no_log: true
  run_once: true
  delegate_to: "{{ garage_coordinator }}"

- name: Import the Loki S3 key
  ansible.builtin.command:
    argv:
      - /usr/local/bin/garage
      - key
      - import
      - --yes
      - -n
      - "{{ garage_loki_key_name }}"
      - "{{ vault_garage_loki_access_key }}"
      - "{{ vault_garage_loki_secret_key }}"
  changed_when: true
  when: garage_loki_key_info.rc != 0
  no_log: true
  run_once: true
  delegate_to: "{{ garage_coordinator }}"

- name: Grant the Loki key access to the monitoring bucket
  ansible.builtin.command:
    argv:
      - /usr/local/bin/garage
      - bucket
      - allow
      - --read
      - --write
      - "{{ garage_loki_bucket_name }}"
      - --key
      - "{{ vault_garage_loki_access_key }}"
  changed_when: false
  no_log: true
  run_once: true
  delegate_to: "{{ garage_coordinator }}"

- name: Verify S3 authentication, isolation and object round trips
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - '-'
    stdin: |
      import os
      import uuid

      import boto3
      from botocore import UNSIGNED
      from botocore.config import Config
      from botocore.exceptions import ClientError

      endpoint = os.environ['S3_ENDPOINT']

      def s3_client(access=None, secret=None, unsigned=False):
          return boto3.client(
              's3',
              endpoint_url=endpoint,
              region_name=os.environ['S3_REGION'],
              aws_access_key_id=access or 'invalid-access-key',
              aws_secret_access_key=secret or 'invalid-secret-key',
              config=Config(
                  signature_version=UNSIGNED if unsigned else 's3v4',
                  s3={'addressing_style': 'path'},
                  connect_timeout=5,
                  read_timeout=15,
                  retries={'max_attempts': 2},
              ),
          )

      def require_denied(call):
          try:
              call()
          except ClientError as error:
              status = error.response['ResponseMetadata']['HTTPStatusCode']
              if status not in (401, 403):
                  raise
          else:
              raise RuntimeError('A forbidden S3 request succeeded')

      def verify_round_trip(client, bucket):
          key = '_ansible-check/' + uuid.uuid4().hex
          payload = b'garage-s3-cluster-check'
          try:
              client.put_object(Bucket=bucket, Key=key, Body=payload)
              downloaded = client.get_object(Bucket=bucket, Key=key)['Body'].read()
              if downloaded != payload:
                  raise RuntimeError('Downloaded object differs from uploaded object')
          finally:
              client.delete_object(Bucket=bucket, Key=key)

      app_bucket = os.environ['APP_BUCKET']
      loki_bucket = os.environ['LOKI_BUCKET']
      app = s3_client(os.environ['APP_ACCESS_KEY'], os.environ['APP_SECRET_KEY'])
      loki = s3_client(os.environ['LOKI_ACCESS_KEY'], os.environ['LOKI_SECRET_KEY'])
      anonymous = s3_client(unsigned=True)

      require_denied(lambda: anonymous.list_objects_v2(Bucket=app_bucket, MaxKeys=1))
      require_denied(lambda: anonymous.list_objects_v2(Bucket=loki_bucket, MaxKeys=1))
      require_denied(lambda: app.list_objects_v2(Bucket=loki_bucket, MaxKeys=1))
      require_denied(lambda: loki.list_objects_v2(Bucket=app_bucket, MaxKeys=1))
      verify_round_trip(app, app_bucket)
      verify_round_trip(loki, loki_bucket)
  environment:
    S3_ENDPOINT: "http://127.0.0.1:{{ garage_s3_port }}"
    S3_REGION: "{{ garage_s3_region }}"
    APP_BUCKET: "{{ garage_app_bucket_name }}"
    APP_ACCESS_KEY: "{{ vault_garage_app_access_key }}"
    APP_SECRET_KEY: "{{ vault_garage_app_secret_key }}"
    LOKI_BUCKET: "{{ garage_loki_bucket_name }}"
    LOKI_ACCESS_KEY: "{{ vault_garage_loki_access_key }}"
    LOKI_SECRET_KEY: "{{ vault_garage_loki_secret_key }}"
  changed_when: false
  no_log: true
  run_once: true
  delegate_to: "{{ garage_coordinator }}"

- name: Report Garage S3 initialization
  ansible.builtin.debug:
    msg: >-
      Garage cluster is healthy. Buckets {{ garage_app_bucket_name }} and
      {{ garage_loki_bucket_name }} are configured with separate application
      and Loki credentials.
  run_once: true
