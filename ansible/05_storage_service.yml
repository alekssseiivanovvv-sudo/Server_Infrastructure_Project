---
- name: Install and configure SeaweedFS storage
  hosts: s3_servers
  become: true
  gather_facts: true

  vars_files:
    - group_vars/group/all/vault.yml

  vars:
    seaweedfs_version: "4.48"
    seaweed_admin_user: seaweed_sysuser
    seaweed_enable_sync: false
    seaweed_data_dir: /srv/seaweedfs
    seaweed_volume_max: 20
    seaweed_s3_config_dir: /etc/seaweedfs
    seaweed_s3_config_file: /etc/seaweedfs/s3.json

  roles:
    - seaweedfs
