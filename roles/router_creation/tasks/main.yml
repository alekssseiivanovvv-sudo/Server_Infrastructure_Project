---
- name: Install VM creation tools on hypervisor
  ansible.builtin.apt:
    name:
      - qemu-utils
      - libvirt-clients
      - virtinst
      - cloud-image-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: List existing virtual machines
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - qemu:///system
      - list
      - --all
      - --name
  register: router_domains
  changed_when: false

- name: Create router if it does not exist
  when: router_name not in router_domains.stdout_lines
  block:
    - name: Check administrator and Tailscale key
      ansible.builtin.assert:
        that:
          - selected_admin_users | length == 1
          - (selected_admin_users | first).password_hash is defined
          - (selected_admin_users | first).password_hash | length > 20
          - vault_cloud_router_tailscale_auth_key is defined
          - vault_cloud_router_tailscale_auth_key | default('') is match('^tskey-auth-')
        fail_msg: Check vault_admin_users and vault_cloud_router_tailscale_auth_key in Vault.
      no_log: true

    - name: Calculate base image checksum
      ansible.builtin.stat:
        path: "{{ router_image }}"
        checksum_algorithm: sha512
      register: router_image_stat

    - name: Check official Alpine image
      ansible.builtin.assert:
        that:
          - router_image_stat.stat.exists
          - router_image_stat.stat.checksum | default('') == router_image_sha512
        fail_msg: Alpine image is missing or its checksum does not match.

    - name: List active networks
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - net-list
          - --name
      register: router_active_networks
      changed_when: false

    - name: Check WAN and LAN networks
      ansible.builtin.assert:
        that:
          - router_wan_network in router_active_networks.stdout_lines
          - router_lan_network in router_active_networks.stdout_lines
        fail_msg: Both router networks must already be active.

    - name: Read LAN network configuration
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - net-dumpxml
          - "{{ router_lan_network }}"
      register: router_lan_xml
      changed_when: false

    - name: Check that LAN is isolated and has no hypervisor IP
      ansible.builtin.assert:
        that:
          - "'<ip ' not in router_lan_xml.stdout"
          - "'<forward' not in router_lan_xml.stdout"
        fail_msg: Review LAN configuration before creating the router.

    - name: Create VM directory
      ansible.builtin.file:
        path: "{{ router_directory }}"
        state: directory
        owner: root
        group: kvm
        mode: "0750"

    - name: Create private cloud-init directory
      ansible.builtin.file:
        path: "{{ router_directory }}/cloud-init"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate cloud-init files from templates
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ router_directory }}/cloud-init/{{ item }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - user-data
        - meta-data
        - network-config
      no_log: true
      diff: false

    - name: Create independent VM disk
      ansible.builtin.command:
        argv:
          - qemu-img
          - convert
          - -f
          - qcow2
          - -O
          - qcow2
          - "{{ router_image }}"
          - "{{ router_disk }}"
        creates: "{{ router_disk }}"

    - name: Read VM disk size
      ansible.builtin.command:
        argv:
          - qemu-img
          - info
          - --output=json
          - "{{ router_disk }}"
      register: router_disk_info
      changed_when: false

    - name: Expand VM disk
      ansible.builtin.command:
        argv:
          - qemu-img
          - resize
          - "{{ router_disk }}"
          - "{{ router_disk_size_bytes | string }}"
      when: >-
        (router_disk_info.stdout | from_json)['virtual-size'] | int
        < router_disk_size_bytes | int

    - name: Set VM disk permissions
      ansible.builtin.file:
        path: "{{ router_disk }}"
        owner: libvirt-qemu
        group: kvm
        mode: "0600"

    - name: Create cloud-init seed ISO
      ansible.builtin.command:
        argv:
          - cloud-localds
          - "--network-config={{ router_directory }}/cloud-init/network-config"
          - "{{ router_directory }}/seed.iso"
          - "{{ router_directory }}/cloud-init/user-data"
          - "{{ router_directory }}/cloud-init/meta-data"
      no_log: true

    - name: Set seed ISO permissions
      ansible.builtin.file:
        path: "{{ router_directory }}/seed.iso"
        owner: root
        group: kvm
        mode: "0640"

    - name: Create and start router VM
      ansible.builtin.command:
        argv:
          - virt-install
          - --connect
          - qemu:///system
          - --name
          - "{{ router_name }}"
          - --memory
          - "{{ router_memory_mb | string }}"
          - --vcpus
          - "{{ router_vcpus | string }}"
          - --osinfo
          - generic
          - --import
          - --boot
          - hd
          - --disk
          - "path={{ router_disk }},format=qcow2,bus=virtio"
          - --disk
          - "path={{ router_directory }}/seed.iso,format=raw,device=cdrom"
          - --network
          - "network={{ router_wan_network }},model=virtio,mac={{ router_wan_mac }}"
          - --network
          - "network={{ router_lan_network }},model=virtio,mac={{ router_lan_mac }}"
          - --graphics
          - none
          - --console
          - pty,target_type=serial
          - --noautoconsole
          - --autostart

- name: Show next verification step
  ansible.builtin.debug:
    msg: >-
      {{ router_name }} is defined.
      Existing VMs are not recreated or rebooted.
      Check the console, Tailscale registration and cloud-init status.
