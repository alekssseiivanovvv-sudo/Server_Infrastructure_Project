---
- name: Install central monitoring stack
  hosts: monitoring_servers
  become: true
  gather_facts: true

  vars_files:
    - group_vars/group/all/vault.yml

  vars:
    prometheus_version: "3.5.0"
    prometheus_admin_user: prometheus_sysuser
    loki_version: "3.5.1"
    grafana_admin_user: admin
    grafana_admin_password: "{{ vault_grafana_admin_password }}"
    grafana_home_dashboard_path: /var/lib/grafana/dashboards/project/project-overview.json

  roles:
    - monitoring_server

- name: Deploy Grafana dashboards and datasources
  hosts: monitoring_servers
  become: true
  vars_files:
    - group_vars/group/all/vault.yml
  roles:
    - grafana_dashboards

