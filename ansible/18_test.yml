---
# Temporary bootstrap for Terraform routers.
# It only prepares the disk and cloud-init ISO. Terraform remains responsible
# for defining and starting the libvirt domains.

- name: Prepare Terraform files for Cloud and East routers
  hosts: host_1
  become: true
  gather_facts: false

  vars_files:
    - group_vars/group/all/vault.yml

  vars:
    # These defaults normally come from roles/router_creation/defaults/main.yml.
    # This bootstrap playbook includes the preparation task directly, so they
    # must be declared here as well.
    router_lan_netmask: 255.255.255.224
    router_swap_size_mb: 512
    router_public_key_file: /home/ansible_admin/.ssh/ansible.pub

    terraform_router_definitions:
      - name: cloud_router
        hostname: cloud-router
        instance_id: cloud-router-001
        source_image: /mnt/a400/ISO/alpine-3.24.2-x86_64-cloudinit-r0.qcow2
        lan_address: 192.168.74.1
        lan_subnet: 192.168.74.0/27
        wan_mac: "52:54:00:74:01:01"
        lan_mac: "52:54:00:74:01:02"
        tailscale_auth_key: "{{ vault_cloud_router_tailscale_auth_key }}"
      - name: east_router
        hostname: east-router
        instance_id: east-router-001
        source_image: /mnt/a400/ISO/alpine-3.24.2-x86_64-cloudinit-r0.qcow2
        lan_address: 192.168.72.1
        lan_subnet: 192.168.72.0/27
        wan_mac: "52:54:00:72:01:01"
        lan_mac: "52:54:00:72:01:02"
        tailscale_auth_key: "{{ vault_east_router_tailscale_auth_key }}"

  tasks:
    - name: Prepare Terraform router files
      ansible.builtin.include_tasks: roles/router_creation/tasks/prepare_terraform_router_files.yml
      loop: "{{ terraform_router_definitions }}"
      loop_control:
        loop_var: terraform_router
        label: "{{ terraform_router.name }}"
      vars:
        router_name: "{{ terraform_router.name }}"
        router_hostname: "{{ terraform_router.hostname }}"
        router_instance_id: "{{ terraform_router.instance_id }}"
        router_source_image: "{{ terraform_router.source_image }}"
        router_directory: "/var/lib/libvirt/images/vms/{{ terraform_router.name }}"
        router_disk: "/var/lib/libvirt/images/vms/{{ terraform_router.name }}/{{ terraform_router.name }}.qcow2"
        router_lan_address: "{{ terraform_router.lan_address }}"
        router_lan_subnet: "{{ terraform_router.lan_subnet }}"
        router_wan_mac: "{{ terraform_router.wan_mac }}"
        router_lan_mac: "{{ terraform_router.lan_mac }}"
        router_tailscale_auth_key: "{{ terraform_router.tailscale_auth_key }}"


