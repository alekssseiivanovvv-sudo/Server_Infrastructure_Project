---
# Директории Grafana
grafana_provisioning_dir: /etc/grafana/provisioning
# ВАЖНО: отдельный подкаталог. Провайдеры Grafana читают каталог рекурсивно,
# а /var/lib/grafana/dashboards/project принадлежит провайдеру роли
# monitoring_server. Если указать родительский каталог, один и тот же файл
# (project-overview.json) попадёт под два провайдера -> дубль uid -> Grafana
# блокирует запись дашбордов обоих провайдеров.
grafana_dashboards_dir: /var/lib/grafana/dashboards/ansible

# Дашборды проекта (лежат в files/dashboards/ внутри роли).
# Имя файла = uid дашборда.
grafana_dashboard_files:
  - alloy-host-overview.json   # метрики хостов (Prometheus)
  - alloy-logs-overview.json   # ошибки и логи (Loki)
  - alloy-docker-containers.json   # метрики контейнеров (cAdvisor)

# Удалять из grafana_dashboards_dir все *.json, которых нет в списке выше
# (чистит ранее скачанные дашборды). Grafana сама уберёт их из UI.
grafana_dashboards_purge_unmanaged: true

# Файлы, которые ранее лежали в родительском каталоге (старое расположение)
grafana_legacy_dashboard_files:
  - /var/lib/grafana/dashboards/alloy-host-overview.json
  - /var/lib/grafana/dashboards/alloy-logs-overview.json

# Хвосты старой версии роли в /tmp на целевом хосте (скачивание + фикс-скрипт)
grafana_legacy_tmp_files:
  - /tmp/fix_dashboards.py
  - /tmp/alloy-controller.json
  - /tmp/alloy-cluster-overview.json
  - /tmp/alloy-loki.json
  - /tmp/alloy-otel-engine-overview.json
  - /tmp/alloy-prometheus.json
  - /tmp/loki-logs.json
  - /tmp/docker-cadvisor.json
  - /tmp/postgresql.json

# ------------------------------------------------------------------
# Алерты в Telegram (Grafana alerting, provisioning из файлов)
# Токен бота и chat id берутся из ansible-vault:
#   vault_telegram_bot_token, vault_telegram_chat_id
# Если не заданы, алертинг не разворачивается.
# ------------------------------------------------------------------
grafana_telegram_bot_token: "{{ vault_telegram_bot_token | default('') }}"
grafana_telegram_chat_id: "{{ vault_telegram_chat_id | default('') }}"
grafana_alerting_enabled: "{{ (grafana_telegram_bot_token | string | length > 0) and (grafana_telegram_chat_id | string | length > 0) }}"
