---
patroni_cluster_name: project-postgres
patroni_data_dir: /var/lib/postgresql/patroni-main
patroni_rest_port: 8008
postgres_app_database: shopdb
postgres_app_user: appuser
postgres_replication_user: replicator
postgres_backup_user: backup_reader
project_database_remote_dir: /opt/project/database
project_database_sql_file: shopdb.sql
etcd_data_dir: /var/lib/etcd-project
etcd_cluster_token: project-postgres-etcd3-v1
# Set once to the installed major on your chosen Ubuntu image; use same on DB + storage.
postgres_major_version: '18'
backup_restic_user: restic_sysuser
backup_repo_root: /srv/backup/restic-repos
backup_run_now: false
backup_automation_home: /home/ansible_admin
data_admin_ipv4: []
data_extra_client_ipv4: []

# Shared network data for router DNS and nftables roles.
project_dns_domain: project.local
project_dns_upstream_servers:
  - 1.1.1.1
  - 9.9.9.9

project_tailnet_ipv4: 100.64.0.0/10
project_lan_subnets:
  - 192.168.72.0/27
  - 192.168.73.0/27
  - 192.168.74.0/27

router_lan_addresses:
  east_router: 192.168.72.1
  west_router: 192.168.73.1
  cloud_router: 192.168.74.1

# Internal service names point to the nearest HAProxy. Cloud DNS returns both.
router_dns_service_addresses:
  east_router:
    - 192.168.72.2
  west_router:
    - 192.168.73.2
  cloud_router:
    - 192.168.72.2
    - 192.168.73.2
