---
- name: Configure firewall on project routers
  hosts: routers
  become: true
  gather_facts: true

  vars_files:
    - group_vars/group/all/vault.yml

  vars:
    router_firewall_ssh_port: "{{ vault_router_ssh_port }}"
    router_firewall_wan_interface: eth0
    router_firewall_lan_interface: eth1
    router_firewall_tailscale_interface: tailscale0

    router_firewall_lan_addresses:
      east_router: 192.168.72.1
      west_router: 192.168.73.1
      cloud_router: 192.168.74.1

    router_firewall_lan_subnets:
      east_router: 192.168.72.0/27
      west_router: 192.168.73.0/27
      cloud_router: 192.168.74.0/27

    router_firewall_project_subnets:
      - 192.168.72.0/27
      - 192.168.73.0/27
      - 192.168.74.0/27

    # Service port restrictions are applied on destination VMs by 17_data_access.yml.

  roles:
    - router_firewall
