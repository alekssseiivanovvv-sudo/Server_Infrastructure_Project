services:
  backend:
    build: ./backend
    container_name: python-backend
    environment:
      DB_HOST: 192.168.74.4
      DB_PORT: 5000
      DB_NAME: shopdb
      DB_USER: appuser
      DB_PASS: HelloWorld2555
      SEAWEED_ENDPOINT: http://192.168.72.4:8333
      SEAWEED_ACCESS_KEY: any
      SEAWEED_SECRET_KEY: any
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: nginx-web
    ports:
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
