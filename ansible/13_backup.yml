---
- name: Configure database backups on storage nodes
  hosts: backup_storage_servers
  become: true
  gather_facts: true
  vars_files:
    - group_vars/group/all/vault.yml
  roles:
    - project_db_backup

- name: Configure file and etcd backups on source nodes
  hosts: backup_source_servers
  become: true
  gather_facts: true
  vars_files:
    - group_vars/group/all/vault.yml
  roles:
    - project_file_backup
