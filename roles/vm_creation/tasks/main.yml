---
- name: List existing VMs
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - qemu:///system
      - list
      - --all
      - --name
  register: existing_vms
  changed_when: false


- name: Create VM if it does not exist
  when: vm_name not in existing_vms.stdout_lines
  block:
    - name: Select ansible_admin from Vault
      ansible.builtin.set_fact:
        selected_admin_users: "{{ vault_admin_users | selectattr('name', 'equalto', 'ansible_admin') | list }}"
      no_log: true

    - name: Check administrator selection
      ansible.builtin.assert:
        that:
          - selected_admin_users | length == 1
        fail_msg: Vault must contain exactly one ansible_admin account.

    - name: Create VM directory
      ansible.builtin.file:
        path: "{{ vm_directory }}"
        state: directory
        owner: root
        group: kvm
        mode: "0750"

    - name: Create private cloud-init directory
      ansible.builtin.file:
        path: "{{ vm_directory }}/cloud-init"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate common cloud-init files
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ vm_directory }}/cloud-init/{{ item }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - meta-data
        - network-config
      no_log: true
      diff: false

    - name: Generate OS-specific user-data
      ansible.builtin.template:
        src: "user-data-{{ vm_os }}.j2"
        dest: "{{ vm_directory }}/cloud-init/user-data"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false

    - name: Copy OS cloud image
      ansible.builtin.command:
        argv:
          - qemu-img
          - convert
          - -f
          - qcow2
          - -O
          - qcow2
          - "{{ vm_image }}"
          - "{{ vm_directory }}/{{ vm_name }}.qcow2"
        creates: "{{ vm_directory }}/{{ vm_name }}.qcow2"

    - name: Resize system disk
      ansible.builtin.command:
        argv:
          - qemu-img
          - resize
          - "{{ vm_directory }}/{{ vm_name }}.qcow2"
          - "{{ vm_disk_size | string }}"

    - name: Set system disk permissions
      ansible.builtin.file:
        path: "{{ vm_directory }}/{{ vm_name }}.qcow2"
        owner: libvirt-qemu
        group: kvm
        mode: "0600"

    - name: Create empty Storage disks
      ansible.builtin.command:
        argv:
          - qemu-img
          - create
          - -f
          - qcow2
          - "{{ vm_directory }}/{{ item }}.qcow2"
          - 30G
        creates: "{{ vm_directory }}/{{ item }}.qcow2"
      loop:
        - data1
        - data2
      when: vm_name in ['east_storage', 'west_storage']

    - name: Set Storage disk permissions
      ansible.builtin.file:
        path: "{{ vm_directory }}/{{ item }}.qcow2"
        owner: libvirt-qemu
        group: kvm
        mode: "0600"
      loop:
        - data1
        - data2
      when: vm_name in ['east_storage', 'west_storage']

    - name: Create cloud-init seed
      ansible.builtin.command:
        argv:
          - cloud-localds
          - "--network-config={{ vm_directory }}/cloud-init/network-config"
          - "{{ vm_directory }}/seed.iso"
          - "{{ vm_directory }}/cloud-init/user-data"
          - "{{ vm_directory }}/cloud-init/meta-data"
      no_log: true

    - name: Set seed permissions
      ansible.builtin.file:
        path: "{{ vm_directory }}/seed.iso"
        owner: root
        group: kvm
        mode: "0640"

    - name: Create and start VM
      ansible.builtin.command: >-
        virt-install
        --connect qemu:///system
        --name {{ vm_name }}
        --memory {{ vm_memory }}
        --vcpus {{ vm_cpus }}
        --osinfo generic
        --import
        --boot hd
        --disk path={{ vm_directory }}/{{ vm_name }}.qcow2,format=qcow2,bus=virtio
        --disk path={{ vm_directory }}/seed.iso,format=raw,device=cdrom
        {% if vm_name in ['east_storage', 'west_storage'] %}
        --disk path={{ vm_directory }}/data1.qcow2,format=qcow2,bus=virtio,serial=data1
        --disk path={{ vm_directory }}/data2.qcow2,format=qcow2,bus=virtio,serial=data2
        {% endif %}
        --network network=internal,model=virtio,mac={{ vm_mac }}
        --graphics none
        --console pty,target_type=serial
        --noautoconsole
        --autostart
