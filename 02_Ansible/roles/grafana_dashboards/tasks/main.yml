---
- name: Ensure provisioning directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: '0755'
  loop:
    - "{{ grafana_provisioning_dir }}/datasources"
    - "{{ grafana_provisioning_dir }}/dashboards"
    - "{{ grafana_dashboards_dir }}"
    - "{{ grafana_project_dashboards_dir }}"

- name: Deploy datasource provisioning config
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: "{{ grafana_provisioning_dir }}/datasources/ansible.yml"
    owner: grafana
    group: grafana
    mode: '0640'
  notify: Restart Grafana

- name: Deploy dashboard provider config
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: "{{ grafana_provisioning_dir }}/dashboards/ansible.yml"
    owner: grafana
    group: grafana
    mode: '0640'
  notify: Restart Grafana

- name: Remove old/conflicting provisioning files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ grafana_provisioning_dir }}/datasources/project.yml"
    - "{{ grafana_provisioning_dir }}/datasources/sample.yaml"
    - "{{ grafana_provisioning_dir }}/datasources/datasource.yaml"
    - "{{ grafana_provisioning_dir }}/dashboards/project.yml"
  notify: Restart Grafana

# ------------------------------------------------------------------
# Дашборды проекта
# Копируем как есть (copy, не template): в JSON есть {{ }} в легендах
# Grafana, которые Jinja2 иначе попытался бы раскрыть.
# Перезапуск не нужен: провайдер перечитывает каталог раз в
# updateIntervalSeconds (см. dashboards.yml.j2).
# ------------------------------------------------------------------
- name: Deploy project overview dashboard
  ansible.builtin.copy:
    src: "{{ grafana_project_dashboard_source }}"
    dest: "{{ grafana_project_dashboards_dir }}/project-overview.json"
    owner: grafana
    group: grafana
    mode: '0644'

- name: Deploy project dashboards
  ansible.builtin.copy:
    src: "dashboards/{{ item }}"
    dest: "{{ grafana_dashboards_dir }}/{{ item }}"
    owner: grafana
    group: grafana
    mode: '0644'
  loop: "{{ grafana_dashboard_files }}"

# ------------------------------------------------------------------
# Чистка: старые скачанные дашборды и временные файлы
# ------------------------------------------------------------------
- name: Find dashboards not managed by this role
  ansible.builtin.find:
    paths: "{{ grafana_dashboards_dir }}"
    patterns: "*.json"
    excludes: "{{ grafana_dashboard_files }}"
    recurse: true
  register: grafana_unmanaged_dashboards
  when: grafana_dashboards_purge_unmanaged | bool

- name: Remove dashboards not managed by this role
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ grafana_unmanaged_dashboards.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: grafana_dashboards_purge_unmanaged | bool

- name: Remove leftovers of the old locations and download/fix workflow
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ grafana_legacy_dashboard_files + grafana_legacy_tmp_files }}"

# ------------------------------------------------------------------
# Алерты: правила, политика уведомлений и контакт Telegram
# Правила и политика копируются как есть (copy): в них Go-шаблоны Grafana.
# Контакт содержит токен, поэтому template + no_log.
# Файлы alerting читаются при старте Grafana, поэтому notify Restart.
# ------------------------------------------------------------------
- name: Deploy Grafana alerting
  when: grafana_alerting_enabled | bool
  block:
    - name: Ensure alerting provisioning directory exists
      ansible.builtin.file:
        path: "{{ grafana_provisioning_dir }}/alerting"
        state: directory
        owner: grafana
        group: grafana
        mode: '0755'

    - name: Deploy alert rules
      ansible.builtin.copy:
        src: alerting/rules.yml
        dest: "{{ grafana_provisioning_dir }}/alerting/rules.yml"
        owner: grafana
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: Deploy notification policy
      ansible.builtin.copy:
        src: alerting/policies.yml
        dest: "{{ grafana_provisioning_dir }}/alerting/policies.yml"
        owner: grafana
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: Deploy Telegram contact point
      ansible.builtin.template:
        src: contact-points.yml.j2
        dest: "{{ grafana_provisioning_dir }}/alerting/contact-points.yml"
        owner: grafana
        group: grafana
        mode: '0640'
      no_log: true
      notify: Restart Grafana
