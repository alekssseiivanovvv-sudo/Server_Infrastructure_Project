#cloud-config
hostname: cloud-router
manage_etc_hosts: true

users:
  - name: ansible_admin
    groups: [wheel]
    shell: /bin/ash
    lock_passwd: false
    hashed_passwd: "{{ vault_router_password_hash }}"
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEDxShItmsyj2ENAypNpdHXNgy9W8HWYTuXhTqj/IX+p ansible_admin@automation-node

disable_root: true
ssh_pwauth: false

package_update: true
packages:
  - openssh
  - sudo
  - python3
  - tailscale
  - tailscale-openrc

runcmd:
  - [rc-update, add, sshd, default]
  - [rc-service, sshd, start]
  - [rc-update, add, tailscale, default]
  - [rc-service, tailscale, start]
