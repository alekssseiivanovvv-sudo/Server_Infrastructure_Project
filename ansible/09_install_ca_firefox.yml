---
- name: Install internal CA into host Firefox browsers
  hosts: hypervisor_hosts
  become: true
  gather_facts: true

  vars:
    ca_nickname: "Project Internal Root CA"
    ca_crt_src: "/home/ansible_admin/project-certs/project-root-ca.crt"
    ca_crt_dest: /usr/local/share/ca-certificates/project-root-ca.crt

  tasks:
    - name: Install Firefox certificate tools
      ansible.builtin.apt:
        name:
          - ca-certificates
          - libnss3-tools
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Copy CA certificate to system trust directory
      ansible.builtin.copy:
        src: "{{ ca_crt_src }}"
        dest: "{{ ca_crt_dest }}"
        owner: root
        group: root
        mode: "0644"

    - name: Update system CA trust
      ansible.builtin.command: update-ca-certificates
      changed_when: false
      when: ansible_facts.os_family == "Debian"

    - name: Add project domain names to hosts file
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '.*shop\.project\.local.*'
        line: "192.168.74.4 shop.project.local load-balancer.project.local"
        state: present

    - name: Find Firefox profiles
      ansible.builtin.shell: |
        set -eu
        find /home -type f -name cert9.db 2>/dev/null | sed 's#/cert9.db##'
      register: firefox_profiles
      changed_when: false
      failed_when: false

    - name: Import CA into Firefox profiles
      ansible.builtin.shell: |
        set -eu
        profile_db="sql:{{ item }}"
        profile_user="$(stat -c '%U' '{{ item }}')"

        sudo -u "$profile_user" certutil -D -d "$profile_db" -n "{{ ca_nickname }}" >/dev/null 2>&1 || true
        sudo -u "$profile_user" certutil -A -d "$profile_db" -n "{{ ca_nickname }}" -t "C,," -i "{{ ca_crt_dest }}"
      loop: "{{ firefox_profiles.stdout_lines }}"
      when: firefox_profiles.stdout_lines | length > 0
