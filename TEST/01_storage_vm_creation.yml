---
- name: Create east storage test VM
  hosts: host_1
  become: true
  gather_facts: false

  vars_files:
    - ../../ansible/group_vars/group/all/vault.yml

  vars:
    vm_name: east_storage_test
    vm_ip: 192.168.72.10
    vm_gateway: 192.168.72.1
    vm_memory: 4096
    vm_cpus: 2
    vm_disk_size: 20G
    vm_mac: "52:54:00:72:10:01"
    vm_image: "/mnt/a400/ISO/ubuntu-26.04-server-cloudimg-amd64.img"
    vm_directory: "/mnt/p5+/KVM/storage-test/east_storage_test"

  roles:
    - storage_vm_creation


- name: Create cloud storage test VM
  hosts: host_1
