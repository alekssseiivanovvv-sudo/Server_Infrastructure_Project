---
- name: Refuse implicit migration from etcd v2
  hosts: patroni_servers
  become: true
  gather_facts: false

  vars_files:
    - group_vars/group/all/vault.yml

  tasks:
    - name: Inspect existing Patroni configuration
      ansible.builtin.stat:
        path: /etc/patroni/config.yml
      register: old_patroni_config
    - name: Read existing configuration
      ansible.builtin.slurp:
        src: /etc/patroni/config.yml
      register: old_patroni_content
      when: old_patroni_config.stat.exists
      no_log: true
    - name: Refuse changing an existing v2 cluster in-place
      ansible.builtin.assert:
        that:
          - "'etcd' not in (old_patroni_content.content | b64decode | from_yaml)"
        fail_msg: 'Existing etcd v2 cluster detected. Follow README migration using NEW VMs; do not delete PostgreSQL data.'
      when: old_patroni_config.stat.exists
      no_log: true

- name: Configure etcd v3 members
  hosts: etcd_servers
  become: true
  gather_facts: true

  vars_files:
    - group_vars/group/all/vault.yml

  tasks:
    - name: Require Ubuntu and supported cluster size
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - groups['etcd_servers'] | length in [1, 3]
    - name: Install etcd
      ansible.builtin.apt:
        name: [etcd-server, etcd-client]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Create data directory
      ansible.builtin.file:
        path: "{{ etcd_data_dir }}"
        state: directory
        owner: etcd
        group: etcd
        mode: '0700'
    - name: Configure etcd
      ansible.builtin.template:
        src: templates/etcd.env.j2
        dest: /etc/default/etcd-project
        mode: '0644'
      notify: Restart etcd
    - name: Install explicit etcd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/etcd.service
        mode: '0644'
        content: |
          [Unit]
          Description=Project etcd v3
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=etcd
          Group=etcd
          EnvironmentFile=/etc/default/etcd-project
          ExecStart=/usr/bin/etcd
          Restart=on-failure
          RestartSec=5
          LimitNOFILE=65536
          [Install]
          WantedBy=multi-user.target
      notify: Restart etcd
    - name: Enable etcd
      ansible.builtin.systemd:
        name: etcd
        enabled: true
        state: started
        daemon_reload: true
    - name: Apply configuration on all members before checking quorum
      ansible.builtin.meta: flush_handlers
    - name: Wait for healthy etcd v3 endpoint
      ansible.builtin.command: etcdctl --endpoints=http://127.0.0.1:2379 endpoint health
      environment:
        ETCDCTL_API: '3'
      register: etcd_health
      until: etcd_health.rc == 0
      retries: 30
      delay: 3
      changed_when: false
  handlers:
    - name: Restart etcd
      ansible.builtin.systemd:
        name: etcd
        state: restarted
        daemon_reload: true

- name: Configure PostgreSQL and Patroni
  hosts: patroni_servers
  become: true
  gather_facts: true
  serial: 1
  vars_files:
    - group_vars/group/all/vault.yml
  tasks:
    - name: Check required credentials
      ansible.builtin.assert:
        that:
          - lookup('vars', item, default='') | string | length > 0
        fail_msg: "Missing or empty Vault variable: {{ item }}"
        success_msg: "Vault variable is present: {{ item }}"
      loop:
        - vault_postgres_superuser_password
        - vault_postgres_replication_password
        - vault_postgres_app_password
        - vault_postgres_backup_password
        - vault_patroni_api_password
      no_log: false
    - name: Check PostgreSQL autotuning variables
      ansible.builtin.assert:
        that:
          - postgres_tuning_config_path | default('') | length > 0
          - postgres_tuning_storage in ['auto', 'ssd', 'hdd']
          - postgres_tuning_assumed_max_connections | int >= 10
        fail_msg: >-
          PostgreSQL autotuning requires a config path, storage type
          auto/ssd/hdd, and at least 10 assumed connections.
    - name: Install PostgreSQL and Patroni
      ansible.builtin.apt:
        name:
          - "postgresql-{{ postgres_major_version }}"
          - "postgresql-client-{{ postgres_major_version }}"
          - patroni
          - python3-psycopg2
          - python3-etcd
          - python3-etcd3gw
          - sudo
          - util-linux
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Stop and mask distribution-managed default cluster
      ansible.builtin.systemd:
        name: "postgresql@{{ postgres_major_version }}-main.service"
        state: stopped
        enabled: false
        masked: true
    - name: Stop distribution PostgreSQL umbrella service
      ansible.builtin.systemd:
        name: postgresql
        state: stopped
        enabled: false
    - name: Create Patroni configuration directory
      ansible.builtin.file:
        path: /etc/patroni
        state: directory
        mode: '0750'
        owner: root
        group: postgres
    - name: Create PostgreSQL data directory
      ansible.builtin.file:
        path: "{{ patroni_data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'
    - name: Install PostgreSQL hardware autotuner
      ansible.builtin.copy:
        src: files/postgresql-autotune.py
        dest: /usr/local/sbin/project-postgresql-autotune
        owner: root
        group: root
        mode: '0755'
    - name: Generate hardware-specific PostgreSQL configuration
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/project-postgresql-autotune
          - --output
          - "{{ postgres_tuning_config_path }}"
          - --data-dir
          - "{{ patroni_data_dir }}"
          - --storage
          - "{{ postgres_tuning_storage }}"
          - --max-connections
          - "{{ postgres_tuning_assumed_max_connections | string }}"
      register: postgresql_autotune_result
      changed_when: postgresql_autotune_result.stdout is search('^updated:')
      notify: Restart Patroni
    - name: Verify generated PostgreSQL tuning configuration
      ansible.builtin.stat:
        path: "{{ postgres_tuning_config_path }}"
      register: postgresql_tuning_config
      failed_when: >-
        not postgresql_tuning_config.stat.exists or
        not postgresql_tuning_config.stat.isreg
    - name: Verify PostgreSQL can read tuning configuration
      ansible.builtin.command:
        argv:
          - test
          - -r
          - "{{ postgres_tuning_config_path }}"
      become_user: postgres
      changed_when: false
    - name: Install Patroni configuration
      ansible.builtin.template:
        src: templates/patroni.yml.j2
        dest: /etc/patroni/config.yml
        owner: root
        group: postgres
        mode: '0640'
      no_log: true
      notify: Restart Patroni
    - name: Install explicit Patroni systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/patroni.service
        mode: '0644'
        content: |
          [Unit]
          Description=Project Patroni
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=postgres
          Group=postgres
          RuntimeDirectory=postgresql
          RuntimeDirectoryMode=2775
          ExecStart=/usr/bin/patroni /etc/patroni/config.yml
          KillMode=process
          TimeoutStopSec=120
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
      notify: Restart Patroni
    - name: Apply configuration before waiting
      ansible.builtin.meta: flush_handlers
    - name: Enable Patroni
      ansible.builtin.systemd:
        name: patroni
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for a healthy PostgreSQL process on this node
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8008/health"
        status_code: 200
      register: node_health
      until: node_health.status | default(0) == 200
      retries: 60
      delay: 5
    - name: Wait for node to become a primary or streaming replica
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8008/patroni"
        status_code: 200
      register: node_state
      until: >-
        node_state.status | default(0) == 200 and
        node_state.json.state | default('') == 'running' and
        (node_state.json.role | default('') in ['primary', 'master'] or
         (node_state.json.role | default('') == 'replica' and
          node_state.json.replication_state | default('') == 'streaming'))
      retries: 60
      delay: 5
  handlers:
    - name: Restart Patroni
      ansible.builtin.systemd:
        name: patroni
        state: restarted
        daemon_reload: true

- name: Initialize application database on current Patroni primary
  hosts: patroni_servers
  become: true
  gather_facts: false

  vars_files:
    - group_vars/group/all/vault.yml

  tasks:
    - name: Read current primary status
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8008/primary"
        status_code: [200, 503]
      register: patroni_primary_check
      changed_when: false

    - name: Mark primary
      ansible.builtin.set_fact:
        is_postgres_primary: "{{ patroni_primary_check.status | int == 200 }}"

    - name: Require exactly one primary before changing SQL objects
      ansible.builtin.assert:
        that:
          - groups['patroni_servers'] | map('extract', hostvars, 'is_postgres_primary') | select('equalto', true) | list | length == 1
      run_once: true

    - name: Copy and apply application database SQL on primary
      ansible.builtin.include_role:
        name: project_database
      when: is_postgres_primary

    - name: Show Patroni cluster status
      ansible.builtin.command:
        argv:
          - patronictl
          - -c
          - /etc/patroni/config.yml
          - list
      register: patroni_cluster_status
      changed_when: false

    - name: Print Patroni cluster status
      ansible.builtin.debug:
        var: patroni_cluster_status.stdout_lines
